<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moving People Teacher Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Year 7 Geography teacher hub for Waiheke High School: Migration.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}

/* Layout: navy banner, sticky tab bar with a numbered lesson row, then one view at a time.
   WHS brand: deep navy + gold, Space Grotesk headings, Manrope body, JetBrains Mono labels. */
:root {
  --bg:#e2e8f0; --card:#ffffff; --card2:#f8fafc; --ink:#0f172a; --muted:#475569; --line:#cbd5e1;
  --head:#002066; --accent:#002066; --accent-ink:#ffffff; --gold:#c5a059; --goldtext:#8b6508; --chip:#f1f5f9;
  --navy:#002066; --navy-deep:#001033; --light:#d1e6f6;
  --paper:#ffffff; --paper-ink:#0f172a; --paper-line:#94a3b8;
  --ok:#15803d; --warn:#b45309; --care-bg:#ecfeff; --care-edge:#0891b2; --watch-bg:#fff7ed; --watch-edge:#ea580c;
  --st-connect:#7e22ce; --st-ido:#1e3a8a; --st-wedo:#0f766e; --st-youdo:#15803d; --st-review:#b45309;
  --m-book:#15803d; --m-sheet:#c2410c; --m-dev:#2563eb; --m-talk:#7e22ce;
  --f-head:'Space Grotesk','Manrope',system-ui,sans-serif; --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
  --head:#d1e6f6; --accent:#c5a059; --accent-ink:#002066; --goldtext:#e9c980; --chip:#0f172a;
  --care-bg:rgba(14,116,144,.22); --watch-bg:rgba(234,88,12,.14); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
  --head:#d1e6f6; --accent:#c5a059; --accent-ink:#002066; --goldtext:#e9c980; --chip:#0f172a;
  --care-bg:rgba(14,116,144,.22); --watch-bg:rgba(234,88,12,.14); color-scheme:dark; }

* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6; padding-bottom:4rem; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--bg); }
h1,h2,h3,h4 { font-family:var(--f-head); margin:0; text-wrap:balance; line-height:1.15; }
p { margin:0; }
a { color:inherit; }
button { font:inherit; cursor:pointer; }
:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.wrap { max-width:88rem; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.mono { font-family:var(--f-mono); }
.kicker { font-family:var(--f-mono); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--goldtext); }

/* banner */
.banner { background:linear-gradient(135deg,#002066,#001033); color:#fff; border-radius:0 0 .9rem .9rem; padding-block:1.8rem; margin-bottom:0; position:relative; overflow:hidden; }
@media (min-width:768px) { .banner { border-radius:.9rem; margin-top:1rem; } }
.banner .inner { display:flex; flex-wrap:wrap; gap:1.2rem; justify-content:space-between; align-items:flex-end; padding-inline:1.6rem; }
.banner .pill { display:inline-block; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); border-radius:999px; padding:.2rem .8rem; font-size:.7rem; letter-spacing:.14em; font-weight:800; color:var(--light); text-transform:uppercase; }
.banner .teach { display:inline-block; margin-left:.5rem; background:var(--gold); color:#002066; border-radius:999px; padding:.2rem .7rem; font-size:.66rem; letter-spacing:.12em; font-weight:800; text-transform:uppercase; }
.banner h1 { font-size:clamp(2rem,5vw,3.4rem); font-weight:700; letter-spacing:-.02em; margin-top:.7rem; }
.banner .sub { color:#bfd3ef; max-width:44rem; margin-top:.4rem; }
.banner .stats { display:flex; gap:.7rem; flex-wrap:wrap; }
.banner .stat { background:rgba(30,58,138,.55); border:1px solid rgba(147,197,253,.3); border-radius:.8rem; padding:.7rem 1rem; min-width:7.5rem; }
.banner .stat b { display:block; font-family:var(--f-head); font-size:1.5rem; color:var(--gold); line-height:1; }
.banner .stat span { font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:#bfd3ef; font-weight:700; }
.banner .modebtn { position:absolute; top:1rem; right:1rem; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:999px; width:2.2rem; height:2.2rem; }

/* nav */
.navbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding-block:.7rem; margin-bottom:1.6rem; }
.tabs { display:flex; flex-wrap:wrap; gap:.45rem; justify-content:center; }
.tab { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:.55rem; padding:.45rem .9rem; font-weight:800; font-size:.85rem; }
.tab:hover { border-color:var(--gold); }
.tab.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.tab.dl { border-color:var(--gold); }
.lrow { display:flex; flex-wrap:wrap; gap:.3rem; justify-content:center; align-items:center; margin-top:.6rem; padding-top:.6rem; border-top:1px solid var(--line); }
.lrow .lab { font-family:var(--f-mono); font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-right:.3rem; }
.lchip { min-width:2.2rem; padding:.25rem .45rem; border-radius:.45rem; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:800; font-size:.8rem; font-family:var(--f-mono); }
.lchip:hover { border-color:var(--gold); }
.lchip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.lchip.as { border-color:#dc2626; }
.lchip.on.as { background:#dc2626; color:#fff; border-color:#dc2626; }

/* cards */
.card { background:var(--card); border:1px solid var(--line); border-radius:.8rem; padding:1.4rem; box-shadow:0 8px 14px -6px rgba(0,0,0,.08); min-width:0; }
.card.top { border-top:4px solid var(--head); }
.card h2 { font-size:1.6rem; color:var(--head); font-weight:700; }
.card h3 { font-size:1.15rem; color:var(--head); font-weight:700; margin-bottom:.7rem; }
.stack { display:flex; flex-direction:column; gap:1.4rem; }
.grid2 { display:grid; gap:1.4rem; grid-template-columns:1fr; }
@media (min-width:1024px) { .grid2 { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } .grid-lesson { grid-template-columns:minmax(0,5fr) minmax(0,6fr) !important; } }
.grid-lesson { display:grid; gap:1.4rem; grid-template-columns:minmax(0,1fr); align-items:start; } .grid-lesson > *, .stack > * { min-width:0; }
.muted { color:var(--muted); }
.small { font-size:.85rem; }

/* chips */
.chips { display:flex; flex-wrap:wrap; gap:.35rem; }
.chip { font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:.18rem .55rem; border-radius:999px; color:#fff; white-space:nowrap; }
.c-book { background:var(--m-book); } .c-dev { background:var(--m-dev); } .c-sheet { background:var(--m-sheet); } .c-talk { background:var(--m-talk); }
.c-ass { background:#dc2626; } .c-tag { background:var(--chip); color:var(--ink); border:1px solid var(--line); }

/* lesson index */
.lgrid { display:grid; gap:.8rem; grid-template-columns:repeat(auto-fill, minmax(15rem,1fr)); }
.lcard { text-align:left; display:flex; flex-direction:column; gap:.4rem; background:var(--card2); border:1px solid var(--line); border-radius:.7rem; padding:.9rem 1rem; color:var(--ink); }
.lcard:hover { border-color:var(--gold); }
.lcard .n { font-family:var(--f-mono); font-weight:700; color:var(--goldtext); font-size:.8rem; }
.lcard .t { font-family:var(--f-head); font-weight:700; font-size:1.05rem; color:var(--head); line-height:1.2; }
.strand-h { font-family:var(--f-mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:1.1rem 0 .5rem; }

/* plan */
.plan { display:flex; flex-direction:column; gap:.6rem; }
.prow { display:grid; grid-template-columns:6.2rem minmax(0,1fr); gap:.8rem; align-items:start; padding:.7rem; border-radius:.6rem; background:var(--card2); border:1px solid var(--line); }
.stagepill { display:inline-block; color:#fff; font-weight:800; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; padding:.3rem .6rem; border-radius:999px; text-align:center; }
.st-Connect { background:var(--st-connect); } .st-IDo { background:var(--st-ido); } .st-WeDo { background:var(--st-wedo); } .st-YouDo { background:var(--st-youdo); } .st-Review { background:var(--st-review); }
.sc { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.4rem; }
.sc li { display:flex; gap:.6rem; } .sc li::before { content:'✓'; color:var(--goldtext); font-weight:900; }
.box { border-left:4px solid var(--line); padding:.8rem 1rem; border-radius:0 .6rem .6rem 0; background:var(--card2); }
.box.watch { border-color:var(--watch-edge); background:var(--watch-bg); }
.box.care { border-color:var(--care-edge); background:var(--care-bg); }
.box.prep { border-color:var(--gold); }
.box b.h { display:block; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:.25rem; color:var(--muted); }
.links { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.35rem; }
.links a { color:var(--head); font-weight:700; text-decoration-color:var(--gold); text-underline-offset:3px; }
.dl-row { display:flex; flex-wrap:wrap; gap:.5rem; }
.btn { display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:.5rem; padding:.45rem .8rem; font-weight:800; font-size:.82rem; }
.btn:hover { border-color:var(--gold); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn .ext { font-family:var(--f-mono); font-size:.66rem; padding:.05rem .3rem; border-radius:.25rem; background:var(--chip); color:var(--muted); border:1px solid var(--line); }
.btn.primary .ext { background:rgba(255,255,255,.15); color:inherit; border-color:transparent; }
details.key summary { cursor:pointer; font-weight:800; color:var(--head); }
details.key ul { margin:.6rem 0 0; padding-left:1.1rem; }

/* slide viewer */
.viewer .stage-wrap { background:#0b1430; border-radius:.7rem; padding:.6rem; }
.viewer .ctrl { display:flex; align-items:center; gap:.5rem; margin-top:.7rem; flex-wrap:wrap; }
.viewer .count { font-family:var(--f-mono); color:var(--muted); font-size:.8rem; }
.thumbs { display:flex; gap:.4rem; overflow-x:auto; padding-bottom:.3rem; margin-top:.6rem; }
.thumbs button { flex:0 0 auto; border:2px solid transparent; border-radius:.35rem; padding:0; background:none; width:6.6rem; }
.thumbs button.on { border-color:var(--gold); }
.thumbs .mini { pointer-events:none; }

/* the slide itself — a projected object with its own fixed palette */
.slide { --s-navy:#002066; --s-gold:#c5a059; --s-goldtext:#8b6508; --s-light:#d1e6f6; --s-ink:#0f172a; --s-card:#f1f5f9; --s-card2:#fbf6ec; --s-line:#cbd5e1;
  container-type:inline-size; position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:.35rem; background:#fff; color:var(--s-ink); font-family:var(--f-body); }
.slide.dark { background:var(--s-navy); color:#fff; }
.slide .pill { position:absolute; top:2.8cqw; right:5cqw; padding:.55cqw 1.6cqw; border-radius:99cqw; color:#fff; font-weight:800; font-size:1.55cqw; letter-spacing:.12em; text-transform:uppercase; border:.15cqw solid #fff; z-index:2; }
.slide .foot { position:absolute; left:5cqw; bottom:2.2cqw; font-size:1.2cqw; color:#94a3b8; }
.slide.dark .foot { color:#8fa8cf; }
.slide .pad { position:absolute; inset:7.5cqw 5cqw 6cqw 5cqw; display:flex; flex-direction:column; }
.slide .t { font-family:var(--f-head); font-weight:700; color:var(--s-navy); font-size:4.1cqw; line-height:1.1; margin-bottom:2.2cqw; }
.slide .t.sm { font-size:3.3cqw; }
.slide.dark .t { color:#fff; }
.slide .k { font-family:var(--f-mono); color:var(--s-gold); font-weight:700; letter-spacing:.2em; font-size:1.6cqw; text-transform:uppercase; margin-bottom:1cqw; }
.slide .k.g { color:var(--s-goldtext); }
.slide ul.b { margin:0; padding-left:2.4cqw; font-size:2.4cqw; line-height:1.4; }
.slide ul.b li { margin-bottom:1cqw; } .slide ul.b li::marker { color:var(--s-gold); }
.slide.dark ul.b { color:var(--s-light); }
.slide .huge { font-family:var(--f-head); font-weight:700; font-size:6.6cqw; line-height:1.05; color:#fff; }
.slide .ask { font-family:var(--f-head); font-weight:700; color:#fff; line-height:1.12; }
.slide .stat { font-family:var(--f-mono); font-weight:700; color:var(--s-gold); font-size:10cqw; line-height:1; }
.slide .cols { display:grid; gap:2cqw; flex:1; min-height:0; }
.slide .col { background:var(--s-card); border:1px solid var(--s-line); border-radius:1.2cqw; padding:1.8cqw 2.2cqw; min-width:0; }
.slide .col:nth-child(2n) { background:var(--s-card2); }
.slide .col h4 { font-family:var(--f-head); color:var(--s-navy); font-size:2.2cqw; margin-bottom:1cqw; }
.slide .col h4.big { font-size:4.4cqw; color:var(--s-goldtext); }
.slide .col ul.b { font-size:1.85cqw; }
.slide .row { display:flex; gap:2.2cqw; align-items:flex-start; }
.slide .ico { flex:0 0 auto; width:15cqw; height:15cqw; border-radius:50%; background:var(--s-light); display:grid; place-items:center; font-size:7cqw; }
.slide .steps { display:flex; flex-direction:column; gap:1.1cqw; }
.slide .step { display:flex; gap:1.6cqw; align-items:center; font-size:2.15cqw; line-height:1.3; }
.slide .num { flex:0 0 auto; width:4.4cqw; height:4.4cqw; border-radius:50%; background:var(--s-navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:1.8cqw; }
.slide .intro { align-self:flex-start; background:var(--s-card2); border:1px solid var(--s-gold); color:var(--s-goldtext); font-weight:800; font-size:1.7cqw; padding:.5cqw 1.4cqw; border-radius:.9cqw; margin-bottom:1.6cqw; }
.slide .task { display:flex; flex-direction:column; gap:1cqw; }
.slide .trow { display:flex; align-items:center; gap:1.8cqw; background:var(--s-card); border:1px solid var(--s-line); border-radius:1cqw; padding:1.1cqw 1.4cqw; font-size:2cqw; line-height:1.3; }
.slide .mp { flex:0 0 12cqw; text-align:center; color:#fff; font-weight:800; font-size:1.4cqw; padding:.5cqw 0; border-radius:99cqw; }
.slide table { border-collapse:collapse; width:100%; font-size:1.75cqw; }
.slide th { background:var(--s-navy); color:#fff; text-align:left; padding:1cqw 1.2cqw; }
.slide td { border:1px solid var(--s-line); padding:1cqw 1.2cqw; vertical-align:middle; }
.slide tr:nth-child(odd) td { background:var(--s-card); }
.slide td:first-child { font-weight:700; }
.slide .fig { flex:1; min-height:0; display:flex; justify-content:center; }
.slide .fig svg { height:100%; width:auto; max-width:100%; }
.slide .note { font-size:1.2cqw; color:#64748b; font-style:italic; text-align:center; margin-top:.6cqw; }
.slide .bars { flex:1; display:flex; align-items:flex-end; gap:3cqw; padding:0 4cqw; border-bottom:.2cqw solid #94a3b8; min-height:0; }
.slide .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.slide .bar i { display:block; width:100%; background:var(--s-navy); border-radius:.4cqw .4cqw 0 0; }
.slide .bar b { font-size:1.8cqw; margin-bottom:.5cqw; }
.slide .blab { display:flex; gap:3cqw; padding:0 4cqw; font-size:1.6cqw; color:#475569; }
.slide .blab span { flex:1; text-align:center; }
.slide .tl { position:relative; display:grid; margin-top:3cqw; }
.slide .tl::before { content:''; position:absolute; left:0; right:0; top:5.2cqw; height:.35cqw; background:var(--s-gold); }
.slide .tl div { text-align:center; padding:0 .6cqw; position:relative; }
.slide .tl b { display:block; font-family:var(--f-head); color:var(--s-navy); font-size:2.2cqw; height:4cqw; }
.slide .tl i { display:block; width:2.6cqw; height:2.6cqw; margin:0 auto 2cqw; border-radius:50%; background:var(--s-navy); border:.3cqw solid #fff; position:relative; }
.slide .tl span { font-size:1.75cqw; line-height:1.3; }
.slide .numbadge { position:absolute; right:6cqw; bottom:11cqw; width:11cqw; height:11cqw; border-radius:50%; background:var(--s-gold); color:var(--s-navy); display:grid; place-items:center; font-family:var(--f-head); font-weight:700; font-size:5cqw; }
.slide .scrow { display:flex; align-items:center; gap:1.6cqw; background:var(--s-card); border:1px solid var(--s-line); border-radius:1cqw; padding:1.2cqw 1.6cqw; font-size:2.1cqw; margin-bottom:1.2cqw; }
.slide .scrow i { flex:0 0 auto; width:3.8cqw; height:3.8cqw; border-radius:50%; background:var(--s-gold); color:var(--s-navy); display:grid; place-items:center; font-style:normal; font-weight:900; font-size:1.9cqw; }

/* presenter */
#deck { position:fixed; inset:0; z-index:100; background:#000a22; display:none; flex-direction:column; }
#deck.open { display:flex; }
#deck .dstage { flex:1; display:flex; align-items:center; justify-content:center; padding:max(2vh, env(safe-area-inset-top,0px)) max(3vw, env(safe-area-inset-right,0px)) 2vh max(3vw, env(safe-area-inset-left,0px)); min-height:0; }
#deck .dstage .slide { width:min(100%, calc((100vh - 9rem) * 16 / 9)); border-radius:.6rem; }
#deck .dbar { display:flex; gap:.6rem; align-items:center; padding:.6rem max(1rem, env(safe-area-inset-right,0px)) calc(.6rem + env(safe-area-inset-bottom,0px)) max(1rem, env(safe-area-inset-left,0px)); background:#000616; color:#cbd5e1; font-size:.85rem; flex-wrap:wrap; }
#deck .dbar .sp { flex:1; }
#deck .dbtn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#e2e8f0; border-radius:.4rem; padding:.35rem .8rem; font-weight:800; font-size:.8rem; }
#deck .dbtn.on { background:#c5a059; color:#002066; border-color:#c5a059; }
#deck .notes { background:#fef3c7; color:#422006; border-top:3px solid #c5a059; padding:.8rem 1.2rem; max-height:24vh; overflow:auto; font-size:.95rem; white-space:pre-wrap; }

/* worksheet preview — a sheet of paper */
.paper { background:var(--paper); color:var(--paper-ink); border:1px solid var(--line); border-radius:.4rem; padding:1.4rem 1.5rem; max-height:34rem; overflow:auto; font-family:Arial, Helvetica, sans-serif; font-size:.82rem; line-height:1.45; }
.paper .ph { font-size:.6rem; font-weight:700; letter-spacing:.08em; color:#475569; border-bottom:2px solid #c5a059; padding-bottom:.25rem; margin-bottom:.6rem; }
.paper h4 { font-family:Arial, sans-serif; color:#002066; font-size:1.25rem; margin:.4rem 0 .2rem; }
.paper .in { font-style:italic; color:#475569; margin-bottom:.8rem; }
.paper .lbl { font-weight:700; color:#002066; margin:.8rem 0 .35rem; }
.paper .ln { border-bottom:1px solid var(--paper-line); height:1.5rem; }
.paper table { border-collapse:collapse; width:100%; margin-bottom:.4rem; }
.paper th { background:#002066; color:#fff; text-align:left; padding:.3rem .4rem; font-size:.75rem; }
.paper td { border:1px solid var(--paper-line); padding:.3rem .4rem; vertical-align:top; font-size:.75rem; }
.paper .bx { border:1.5px solid #c5a059; background:#fbf6ec; padding:.5rem .7rem; border-radius:.2rem; margin:.4rem 0; }
.paper .bx.g { border-color:#16a34a; background:#f0fdf4; }
.paper .draw { border:1px solid var(--paper-line); height:7rem; }
.paper p { margin:.3rem 0 .5rem; }
