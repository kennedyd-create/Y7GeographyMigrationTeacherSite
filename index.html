sson":13,"label":"Homework week 5 · Queenstown vs Westport","hw":true},{"id":"HW6-sources","lesson":16,"label":"Homework week 6 · project sources","hw":true}],"rubric":{"levels":["Working towards","Achieved","Merit","Excellence"],"rows":[["Why people moved (Section 1)","Names who moved and one reason","Describes push and pull factors for the group","Explains how push and pull factors worked together, including forced or voluntary","Explains drivers in depth and links them to wider changes (e.g. policy, events)"],["Maps and data","Includes a map or figure","Includes a map with title and key","Map is annotated and explained in the writing","Map and data are used as evidence to support conclusions"],["Impacts on place (Section 2)","Names one impact","Describes cultural, economic and landscape impacts","Explains impacts with specific evidence and examples","Explains impacts on both origin and destination, and how they connect"],["Perspectives and support","Mentions one group’s view","Describes a support organisation","Explains how the organisation helps, and one other perspective","Evaluates support and compares perspectives that disagree"],["Communication and sources","Some sources listed","Clear structure; sources listed","Clear, accurate geographical language; sources linked to facts","Polished and precise; full bibliography and honest AI statement"]]},"unit":{"title":"Moving People","unitTitle":"Geography · Migration","kicker":"Year 7 Geography · Term 1 2027","sub":"Why people move, how migration reshapes places across Aotearoa, and what it means for our own island.","bigQ":"“Why do people move — and how does their moving change the places they leave and the places they arrive?”","overview":"This unit examines how international and internal migration patterns shape people, places and environments in New Zealand and locally on Waiheke Island. Students investigate push and pull factors, refugee experiences, post-WWII migration flows, urbanisation and spatial impacts using maps, data visualisations and personal perspectives.","purpose":"To build disciplinary literacy and geographical inquiry skills so students can analyse why people move, evaluate the social, cultural and economic impacts of population movement on communities, and understand demographic change within Aotearoa New Zealand.","duration":"19 lessons (16 core + 3 assessment) · Term 1","integration":[["Literacy","Tier 3 vocabulary, photo annotation (Lesson 7), structured writing frames, evaluating source perspectives in migrant case studies."],["Numeracy","Flow map arrow scales (Lesson 4), net migration, choropleth keys and percentage change (Lesson 12), population bar graphs."],["Mātauranga Māori","Post-WWII Māori urban migration, pepper-potting, urban marae and pan-Māori identity, whanaungatanga (Lesson 11)."],["Local curriculum","Waiheke population change, housing pressure, ferry commuting, Ngāti Pāoa as mana whenua (Lesson 14)."],["AI use","AI Level 2 · AI to plan (Lessons 6 and 17) — brain first, AI step, check it, own it."]],"prior":"Year 5–6 Social Sciences: Polynesian navigation, early settlement, local community histories, foundational map skills.","future":"Year 8–10 Social Sciences: global development, conflict, environmental displacement, detailed demographic analysis.","assessment":[["Before","Lesson 1 brainstorm “Why do people move?” and the Value Continuum. Diagnostic entry card on migration terms."],["During","Weekly book checks, exit tickets, source-analysis worksheets, peer flow map evaluation."],["Mid-unit","Lesson 10: 40-minute paper test + 20-minute device self-check."],["Summative","Lessons 17–19: migration research project (report, infographic or slide deck) with rubric."]],"vocab":[["Migration","Movement of people from one place to another to live"],["Immigration","Moving into a new country to live permanently"],["Emigration","Leaving one’s own country to settle in another"],["Internal migration","Movement within a country’s borders"],["Push factor","A negative aspect driving people away from a place"],["Pull factor","A positive aspect attracting people to a place"],["Refugee","A person forced to flee home because of conflict or persecution, whose need for protection is recognised"],["Asylum seeker","A person seeking legal protection in another country whose claim has not yet been decided"],["Flow map","A map showing movement, with arrow width showing the amount"],["Assisted Passage","Government scheme offering subsidised travel for migrants (from 1947)"],["Spatial clustering","Migrants settling close together for mutual support"],["Remittances","Money sent back to the home country by migrants"],["Urbanisation","The shift of population from rural to urban areas"],["Pepper-potting","Housing policy that scattered Māori families among Pākehā families"],["Pan-Māori identity","Shared identity formed by Māori from many iwi, especially in cities"],["Choropleth map","A map using shading to show data values by area"],["Population density","Number of people living per unit of area (e.g. per km²)"],["Net migration","Arrivals minus departures"]],"homework":[["Week 1",1,4,"Vocabulary practice","Define migration terms on the sheet (10 min); discuss family migration story with caregivers (10 min).",20,"Kia ora whānau, this week in Year 7 Social Sciences we started our new unit on Geography – Migration. Students have a 20-minute homework task due in Lesson 4: key vocabulary and talking with whānau about where your family has come from. Ngā mihi, [Teacher name]","Kia ora class! Please complete your Week 1 vocabulary sheet and talk with your whānau about your family’s migration story. No more than 20 minutes. Due at the start of Lesson 4."],["Week 2",4,7,"Practice questions","Watch a short clip on flow maps (5 min); complete 3 flow map practice questions (15 min).",20,"Kia ora whānau, this week students learned how flow maps show migration using arrow width. Their homework is flow map practice (about 20 minutes), due in Lesson 7. Ngā mihi, [Teacher name]","Kia ora team! Watch the short clip on flow map arrows and answer the 3 practice questions on your sheet. Up to 20 minutes, due in Lesson 7."],["Week 3",7,10,"Revision","Review key terms with flashcards (10 min); complete the practice quiz sheet (15 min).",25,"Kia ora whānau, our mid-unit check is in Lesson 10. Students have 25 minutes of revision homework to prepare key ideas and words. Ngā mihi, [Teacher name]","Kia ora all! Revision week for our Mid-Unit Check in Lesson 10. Use your flashcards and complete the practice quiz (about 25 minutes). Due in Lesson 10."],["Week 4",10,13,"Pre-reading","Read a short Te Ara article on Māori urban migration (10 min); write 3 key points (10 min).",20,"Kia ora whānau, as we move into internal migration within Aotearoa, students have a 20-minute pre-reading task on post-WWII Māori urbanisation, due in Lesson 13. Ngā mihi, [Teacher name]","Kia ora class! Read the Te Ara article on post-WWII Māori urban migration and write 3 key points. About 20 minutes, due at the start of Lesson 13."],["Week 5",13,16,"Comparison","Compare Queenstown growth with Westport decline on the sheet (15 min); one reflection question (10 min).",25,"Kia ora whānau, students are exploring how population change affects New Zealand towns. They have a 25-minute comparison worksheet due in Lesson 16. Ngā mihi, [Teacher name]","Kia ora team! Complete the Queenstown vs Westport comparison sheet. Up to 25 minutes, due in Lesson 16."],["Week 6",16,17,"Project research","Gather 2 sources or images (15 min); draft project headings (10 min).",25,"Kia ora whānau, students are starting their summative migration project. This week’s homework (25 minutes) is to gather two sources before our in-class work sessions. Ngā mihi, [Teacher name]","Kia ora class! Find 2 reliable sources or images for your project and draft your headings. About 25 minutes — bring them to Lesson 17."],["Week 7",19,"—","None","No homework — assessment week. Project x=\"50\" y=\"222\" width=\"190\" height=\"58\" rx=\"6\" fill=\"#b91c1c\"/>\u003crect x=\"60\" y=\"300\" width=\"110\" height=\"110\" fill=\"#bfdbfe\" stroke=\"#475569\"/>\u003crect x=\"180\" y=\"320\" width=\"50\" height=\"110\" fill=\"#64748b\"/>\u003ctext x=\"145\" y=\"247\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#fff\">饺子馆\u003c/text>\u003ctext x=\"145\" y=\"269\" text-anchor=\"middle\" font-size=\"14\" fill=\"#fff\">Dumpling House\u003c/text>\u003crect x=\"270\" y=\"210\" width=\"210\" height=\"220\" fill=\"#bbf7d0\" stroke=\"#475569\"/>\u003crect x=\"280\" y=\"222\" width=\"190\" height=\"58\" rx=\"6\" fill=\"#15803d\"/>\u003crect x=\"290\" y=\"300\" width=\"110\" height=\"110\" fill=\"#bfdbfe\" stroke=\"#475569\"/>\u003crect x=\"410\" y=\"320\" width=\"50\" height=\"110\" fill=\"#64748b\"/>\u003ctext x=\"375\" y=\"247\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"#fff\">SPICE BAZAAR\u003c/text>\u003ctext x=\"375\" y=\"269\" text-anchor=\"middle\" font-size=\"14\" fill=\"#fff\">Indian groceries\u003c/text>\u003crect x=\"500\" y=\"210\" width=\"210\" height=\"220\" fill=\"#fbcfe8\" stroke=\"#475569\"/>\u003crect x=\"510\" y=\"222\" width=\"190\" height=\"58\" rx=\"6\" fill=\"#002066\"/>\u003crect x=\"520\" y=\"300\" width=\"110\" height=\"110\" fill=\"#bfdbfe\" stroke=\"#475569\"/>\u003crect x=\"640\" y=\"320\" width=\"50\" height=\"110\" fill=\"#64748b\"/>\u003ctext x=\"605\" y=\"247\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"#fff\">MONEY TRANSFER\u003c/text>\u003ctext x=\"605\" y=\"269\" text-anchor=\"middle\" font-size=\"14\" fill=\"#fff\">Fiji · Samoa · India\u003c/text>\u003cpolygon points=\"730,250 845,150 960,250\" fill=\"#7c2d12\"/>\u003crect x=\"740\" y=\"250\" width=\"210\" height=\"180\" fill=\"#e2e8f0\" stroke=\"#475569\"/>\u003crect x=\"815\" y=\"340\" width=\"60\" height=\"90\" fill=\"#78350f\"/>\u003crect x=\"750\" y=\"262\" width=\"190\" height=\"54\" rx=\"6\" fill=\"#7c2d12\"/>\u003ctext x=\"845\" y=\"285\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"#fff\">EKALESIA\u003c/text>\u003ctext x=\"845\" y=\"307\" text-anchor=\"middle\" font-size=\"14\" fill=\"#fff\">Samoan church\u003c/text>\u003cline x1=\"150\" y1=\"214\" x2=\"40\" y2=\"80\" stroke=\"#0f172a\" stroke-width=\"2.5\"/>\u003ccircle cx=\"150\" cy=\"214\" r=\"5\" fill=\"#0f172a\"/>\u003crect x=\"36\" y=\"54\" width=\"271.1\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#c5a059\" stroke-width=\"2\"/>\u003ctext x=\"46\" y=\"77\" font-size=\"16\" font-weight=\"700\" fill=\"#0f172a\">Sign in Chinese and English\u003c/text>\u003cline x1=\"380\" y1=\"214\" x2=\"330\" y2=\"140\" stroke=\"#0f172a\" stroke-width=\"2.5\"/>\u003ccircle cx=\"380\" cy=\"214\" r=\"5\" fill=\"#0f172a\"/>\u003crect x=\"326\" y=\"114\" width=\"206\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#c5a059\" stroke-width=\"2\"/>\u003ctext x=\"336\" y=\"137\" font-size=\"16\" font-weight=\"700\" fill=\"#0f172a\">Specialist food shop\u003c/text>\u003cline x1=\"610\" y1=\"214\" x2=\"560\" y2=\"80\" stroke=\"#0f172a\" stroke-width=\"2.5\"/>\u003ccircle cx=\"610\" cy=\"214\" r=\"5\" fill=\"#0f172a\"/>\u003crect x=\"556\" y=\"54\" width=\"168.8\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#c5a059\" stroke-width=\"2\"/>\u003ctext x=\"566\" y=\"77\" font-size=\"16\" font-weight=\"700\" fill=\"#0f172a\">Sends money home\u003c/text>\u003cline x1=\"845\" y1=\"200\" x2=\"700\" y2=\"140\" stroke=\"#0f172a\" stroke-width=\"2.5\"/>\u003ccircle cx=\"845\" cy=\"200\" r=\"5\" fill=\"#0f172a\"/>\u003crect x=\"696\" y=\"114\" width=\"168.8\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#c5a059\" stroke-width=\"2\"/>\u003ctext x=\"706\" y=\"137\" font-size=\"16\" font-weight=\"700\" fill=\"#0f172a\">Place of worship\u003c/text>\u003ctext x=\"980\" y=\"540\" text-anchor=\"end\" font-size=\"13\" fill=\"#334155\">Drawn example street — labels only. Turn each into an annotation.\u003c/text>\u003c/svg>"},"wsCount":28};

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const STAGE_CLS = s => 'st-' + s.replace(/\s/g, '');
const STAGE_COL = { 'Connect':'#7e22ce', 'I Do':'#1e3a8a', 'We Do':'#0f766e', 'You Do':'#15803d', 'Review':'#b45309' };
const MODE = { book:['Book','var(--m-book)'], sheet:['Worksheet','var(--m-sheet)'], device:['Device','var(--m-dev)'], talk:['Talk','var(--m-talk)'] };
const PLANK = [['Connect','c'],['I Do','i'],['We Do','w'],['You Do','y'],['Review','r']];
const TAGS = { Numeracy:'Numeracy', Literacy:'Literacy', Local:'Waiheke context', TeAo:'Mātauranga Māori', AI:'AI lesson', Assess:'Assessment' };
const L = DATA.lessons, U = DATA.unit, F = DATA.files;

/* ---------- theme toggle (per-viewer convenience) ---------- */
function setTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
try { const t = localStorage.getItem('mp-theme'); if (t) setTheme(t); } catch(e){}
$('#modebtn').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; setTheme(t); try { localStorage.setItem('mp-theme', t); } catch(e){}
};

/* ---------- downloads ---------- */
let dlNS;
function downloads(){ if (!dlNS) dlNS = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null); return dlNS; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3800); }
async function grab(path){
  const name = path.split('/').pop();
  const ns = await downloads();
  if (!ns) { const w = window.open(path, '_blank'); if (!w) location.href = path; return; }
  try {
    toast('Preparing ' + name + '…');
    const r = await fetch(path); if (!r.ok) throw new Error('fetch');
    const blob = await r.blob();
    await ns.save({ filename: name, data: blob });
    toast('Saved ' + name);
  } catch (e) {
    if (e && e.code === 'declined') toast('Download cancelled.');
    else if (e && e.code === 'rate_limited') toast('A save prompt is already open. Finish that one first.');
    else toast('Could not download ' + name + '.');
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-dl]'); if (b) { e.preventDefault(); grab(b.getAttribute('data-dl')); } });
const dlBtn = (path, label, ext, primary) => path ? `<button class="btn${primary ? ' primary' : ''}" data-dl="${esc(path)}">⤓ ${esc(label)} <span class="ext">${ext}</span></button>` : '';

/* ---------- chips ---------- */
function modeChips(l){
  const c = [];
  if (l.mode === 'book') c.push('<span class="chip c-book">Book</span>');
  if (l.mode === 'device') c.push('<span class="chip c-dev">Device</span>');
  if (l.mode === 'mix') c.push('<span class="chip c-book">Book</span><span class="chip c-dev">Device</span>');
  if (l.mode === 'assess') c.push('<span class="chip c-ass">Assessment</span>');
  (l.tags || []).filter(t => t !== 'Assess').forEach(t => c.push(`<span class="chip c-tag">${esc(TAGS[t] || t)}</span>`));
  return `<div class="chips">${c.join('')}</div>`;
}

/* ---------- slides ---------- */
function bl(arr){ return `<ul class="b">${arr.map(x => `<li>${md(x)}</li>`).join('')}</ul>`; }
function slideHTML(s, l, i){
  const dark = ['title','ask','fact','review'].includes(s.k);
  let inner = '';
  const T = h => `<div class="t${String(h).length > 52 ? ' sm' : ''}">${md(h)}</div>`;
  switch (s.k) {
    case 'title': inner = `<div class="pad" style="justify-content:center"><div class="k">${esc(s.sub)}</div><div class="huge">${esc(s.h)}</div><div style="margin-top:2.4cqw;font-size:2.3cqw;color:#d1e6f6">Year 7 Geography · Migration</div></div><div class="numbadge">${l.n}</div>`; break;
    case 'aim': inner = `<div class="pad" style="inset:5cqw 5cqw 6cqw"><div class="k g">What we are learning</div><div class="t" style="font-size:${l.li.length > 110 ? 2.9 : 3.2}cqw">${esc(l.li)}</div><div class="k g" style="margin-top:.5cqw">Success criteria</div>${l.sc.map(c => `<div class="scrow"><i>✓</i><span>${esc(c)}</span></div>`).join('')}</div>`; break;
    case 'ask': { const n = s.h.length, fs = n <= 50 ? 5.2 : n <= 80 ? 4.4 : n <= 120 ? 3.7 : 3.2;
      inner = `<div class="pad"><div style="flex:1;display:flex;align-items:flex-end"><div class="ask" style="font-size:${fs}cqw">${esc(s.h)}</div></div><div style="flex:0 0 40%;padding-top:2.4cqw">${s.body ? bl(s.body) : ''}</div></div>`; break; }
    case 'review': inner = `<div class="pad" style="justify-content:center"><div class="k">Review</div><div class="t" style="font-size:5cqw">${esc(s.h)}</div>${bl(s.body)}</div>`; break;
    case 'fact': inner = `<div class="pad" style="justify-content:center"><div class="stat">${esc(s.stat)}</div><div style="font-size:3cqw;color:#d1e6f6;margin:1.4cqw 0 2.4cqw;max-width:85%">${esc(s.statlabel)}</div>${s.body ? `<div style="font-size:.85em">${bl(s.body)}</div>` : ''}</div>`; break;
    case 'idea': inner = `<div class="pad">${T(s.h)}<div class="row"><div class="ico">${s.icon || '•'}</div><div style="flex:1;min-width:0">${bl(s.body)}</div></div></div>`; break;
    case 'two': inner = `<div class="pad">${T(s.h)}<div class="cols" style="grid-template-columns:1fr 1fr">${[s.a, s.b].map(c => `<div class="col"><h4>${md(c.h)}</h4>${bl(c.body)}</div>`).join('')}</div></div>`; break;
    case 'three': inner = `<div class="pad">${T(s.h)}<div class="cols" style="grid-template-columns:1fr 1fr 1fr">${s.cols.map(([h, b]) => `<div class="col"><h4 class="${/^[\d.,%]+$/.test(h) ? 'big' : ''}">${esc(h)}</h4>${bl(b)}</div>`).join('')}</div></div>`; break;
    case 'steps': inner = `<div class="pad">${T(s.h)}${s.intro ? `<div class="intro">${esc(s.intro)}</div>` : ''}<div class="steps">${s.body.map((b, j) => `<div class="step"><span class="num">${j + 1}</span><span>${md(b)}</span></div>`).join('')}</div></div>`; break;
    case 'task': inner = `<div class="pad">${T(s.h)}<div class="task">${s.body.map(b => { const m = /^(\w+):\s*(.*)$/.exec(b); const [lab, col] = MODE[m[1]]; return `<div class="trow"><span class="mp" style="background:${col}">${lab}</span><span>${md(m[2])}</span></div>`; }).join('')}</div></div>`; break;
    case 'table': inner = `<div class="pad">${T(s.h)}<table><thead><tr>${s.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; break;
    case 'bars': { const max = Math.max(...s.data.map(d => d[1]));
      inner = `<div class="pad">${T(s.h)}<div style="text-align:center;font-size:1.6cqw;color:#475569;margin-bottom:1cqw">${esc(s.label)}</div><div class="bars">${s.data.map(d => `<div class="bar"><b>${d[1].toLocaleString('en-NZ')}${s.unit}</b><i style="height:${(d[1] / max * 82).toFixed(1)}%"></i></div>`).join('')}</div><div class="blab">${s.data.map(d => `<span>${esc(d[0])}</span>`).join('')}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}</div>`; break; }
    case 'timeline': inner = `<div class="pad">${T(s.h)}<div class="tl" style="grid-template-columns:repeat(${s.items.length},1fr)">${s.items.map(([y, t]) => `<div><b>${esc(y)}</b><i></i><span>${esc(t)}</span></div>`).join('')}</div></div>`; break;
    case 'flow': case 'choro': case 'street': inner = `<div class="pad">${T(s.h)}<div class="fig">${DATA.svg[s.k]}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}</div>`; break;
  }
  return `<div class="slide${dark ? ' dark' : ''}" role="img" aria-label="Slide ${i + 1}: ${esc(s.h || s.k)} — stage ${esc(s.s)}"><div class="pill" style="background:${STAGE_COL[s.s]}">${esc(s.s)}</div>${inner}<div class="foot">Year 7 Geography · Migration · Lesson ${l.n} · ${i + 1}</div></div>`;
}
function notesFor(l, s){ const p = { 'Connect':'c', 'I Do':'i', 'We Do':'w', 'You Do':'y', 'Review':'r' }[s.s]; let t = s.s.toUpperCase() + '\n' + (l.plan[p] || ''); if (s.s === 'I Do' && l.watch) t += '\n\nWatch for: ' + l.watch + ' Ask: “' + l.ask + '”'; return t; }

/* ---------- presenter ---------- */
const deck = { l:null, i:0, notes:false };
function deckDraw(){
  const l = deck.l, s = l.slides[deck.i];
  $('#dstage').innerHTML = slideHTML(s, l, deck.i);
  $('#dcount').textContent = (deck.i + 1) + ' / ' + l.slides.length;
  $('#dlesson').textContent = 'Lesson ' + l.n + ' · ' + l.t;
  $('#dnotes').textContent = notesFor(l, s); $('#dnotes').hidden = !deck.notes;
  $('#dnotesbtn').classList.toggle('on', deck.notes);
}
function openDeck(n, i){ deck.l = L[n - 1]; deck.i = i || 0; $('#deck').classList.add('open'); document.body.style.overflow = 'hidden'; deckDraw(); $('#dnext').focus(); }
function closeDeck(){ $('#deck').classList.remove('open'); document.body.style.overflow = ''; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
function step(d){ const n = deck.l.slides.length; deck.i = Math.max(0, Math.min(n - 1, deck.i + d)); deckDraw(); }
$('#dprev').onclick = () => step(-1); $('#dnext').onclick = () => step(1); $('#dclose').onclick = closeDeck;
$('#dnotesbtn').onclick = () => { deck.notes = !deck.notes; deckDraw(); };
$('#dfull').onclick = () => { const d = $('#deck'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (d.requestFullscreen) d.requestFullscreen().catch(() => toast('Full screen is not available here.')); };
$('#dstage').onclick = e => { if (!e.target.closest('a,button')) step(1); };
document.addEventListener('keydown', e => {
  if (!$('#deck').classList.contains('open')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); step(1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === 'Escape') closeDeck();
  else if (e.key.toLowerCase() === 'n') { deck.notes = !deck.notes; deckDraw(); }
});

/* ---------- worksheet preview ---------- */
function wsHTML(ws, head, teacher){
  let h = `<div class="ph">${esc(head)}</div>`;
  if (!teacher) h += `<div class="nm"><span>Name:</span><span>Class:</span><span>Date:</span></div>`;
  h += `<h4>${esc(ws.title)}</h4>${ws.intro ? `<div class="in">${esc(ws.intro)}</div>` : ''}`;
  const lines = n => Array.from({ length: n }, () => '<div class="ln"></div>').join('');
  const tbl = (head, rows, rowH) => `<table>${head ? `<thead><tr>${head.map(x => `<th>${md(x)}</th>`).join('')}</tr></thead>` : ''}<tbody>${rows.map(r => `<tr>${r.map(c => `<td style="height:${(rowH || 1.3) * 1.1}rem">${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  (ws.blocks || []).forEach(b => {
    switch (b.t) {
      case 'text': h += `<p>${md(b.body)}</p>`; break;
      case 'note': h += `<p style="font-style:italic;color:#475569;font-size:.7rem">${md(b.body)}</p>`; break;
      case 'wordbank': h += `<div class="bx"><b style="color:#8b6508">Word bank:</b> ${b.words.map(esc).join(' · ')}</div>`; break;
      case 'frame': h += `<div class="bx g"><b style="color:#8b6508">${esc(b.label || 'Sentence starters')}</b><ul style="margin:.2rem 0 0;padding-left:1.1rem">${b.starters.map(s => `<li><i>${esc(s)}</i></li>`).join('')}</ul></div>`; break;
      case 'table': h += (b.label ? `<div class="lbl">${md(b.label)}</div>` : '') + tbl(b.head, b.fixed || Array.from({ length: b.rows || 3 }, () => b.head.map(() => '')), b.rowH); break;
      case 'q': h += `<div class="lbl">${md(b.label)}</div>${lines(b.lines || 3)}`; break;
      case 'lines': h += `<div class="lbl">${md(b.label)}</div>${lines(b.n)}`; break;
      case 'box': h += `<div class="lbl">${md(b.label)}</div><div class="draw"></div>`; break;
      case 'img': h += DATA.svg[b.name]; break;
      case 'ai': h += `<div class="lbl">AI statement (complete if you used AI)</div>` + tbl(null, [['What I used AI for:', ''], ['What I checked, and how:', ''], ['What is entirely my own work:', '']], 1.6); break;
      case 'rubric': h += `<div class="lbl">Rubric</div>` + tbl(['Criterion'].concat(DATA.rubric.levels), DATA.rubric.rows); break;
    }
  });
  return h;
}

function viewerDraw(){
  const l = L[cur.n - 1], s = l.slides[cur.i];
  $('#vstage').innerHTML = slideHTML(s, l, cur.i);

  $('#vnotes').textContent = notesFor(l, s);
  document.querySelectorAll('#vthumbs button').forEach((b, i) => b.classList.toggle('on', i === cur.i));
}
function wireViewer(){
  const l = L[cur.n - 1];
  $('#vprev').onclick = () => { cur.i = Math.max(0, cur.i - 1); viewerDraw(); };
  $('#vnext').onclick = () => { cur.i = Math.min(l.slides.length - 1, cur.i + 1); viewerDraw(); };
  $('#vpresent').onclick = () => openDeck(cur.n, cur.i);
  document.querySelectorAll('#vthumbs button').forEach(b => b.onclick = () => { cur.i = +b.getAttribute('data-th'); viewerDraw(); });
  viewerDraw();
}

function route(){
  const h = (location.hash || '#overview').slice(1);
  const m = /^lesson-(\d+)$/.exec(h);
  let html, key = h;
  if (m && L[+m[1] - 1]) html = vLesson(+m[1]);
  else if (h === 'plan') html = vPlan();
  else if (h === 'vocab') html = vVocab();
  else if (h === 'homework') html = vHomework();
  else if (h === 'assessment') html = vAssess();
  else if (h === 'files') html = vFiles();
  else { html = vOverview(); key = 'overview'; }
  nav(key);
  $('#main').innerHTML = html;
  if (m) wireViewer();
  window.scrollTo(0, 0);
}
