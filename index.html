<script>
const DATA = {"lessons":[{"n":1,"t":"On the move","strand":"Why people move","mode":"book","modeText":"Bookwork","tags":[],"li":"We are learning to define core migration concepts and distinguish between immigration and emigration.","sc":["I can explain what migration is","I can tell the difference between immigration and emigration","I can sort a move into internal or international migration"],"know":"Population change through migration impacts people, places and environments. Migration can be international (immigration and emigration) or internal.","prac":"Think conceptually: define and apply the concepts of migration, immigration, emigration and internal migration.","vocab":["Migration","Immigration","Emigration","Internal migration"],"plan":{"c":"Whiteboard brainstorm: “Why do people move from one place to live in another?” Record every response. Keep it for Lesson 2 — most answers will turn out to be push or pull factors.","i":"Explicitly define the four Tier 3 words using the anchor slides: Migration, Immigration (moving IN), Emigration (moving OUT / exit), Internal migration (moving within a country). Students copy the four definitions.","w":"The Value Continuum. Read the five scenario cards on the slide. Students position themselves along a line in the room: one end “short move, same country”, the other “long move, new country”. Ask two students at each end to justify.","y":"Worksheet: definitions in own words plus the six-scenario sort (internal vs international, immigrant vs emigrant). Book: concept map with MIGRATION in the centre. Extension on the sheet: historical vs modern moves.","r":"Quickfire verbal check: Im = In, E = Exit, Internal = inside. Exit question on the final slide."},"diff":"Visual sentence frames for definitions are printed on the worksheet. Extension: classify historical vs modern movements (worksheet Q4).","watch":"Misconception that immigration and emigration are the same direction.","ask":"If someone leaves New Zealand for London, are they an emigrant from NZ or an immigrant to NZ?","res":[["Te Ara: History of immigration","https://teara.govt.nz/en/history-of-immigration"],["YouTube search: “what is migration” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=what+is+migration+geography+for+kids"]],"hw":"Week 1 homework set: vocabulary definition sheet + talk with whānau about where your family came from (20 min). Due Lesson 4.","slides":[{"s":"Connect","k":"title","h":"On the move","sub":"Lesson 1 · What is migration?"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Why do people move from one place to live in another?","body":["Brainstorm. Every idea goes on the board.","Think about family, jobs, school, safety, weather…"]},{"s":"I Do","k":"idea","h":"Migration","icon":"🧭","body":["**Migration** = people moving from one place to another **to live**.","It can happen inside a country or between countries.","A holiday is not migration. Migrants move to live somewhere new."]},{"s":"I Do","k":"two","h":"Two kinds of migration","a":{"h":"🌏 International","body":["Moving between countries","**Immigration** = moving INTO a new country (Im = In)","**Emigration** = leaving your own country (E = Exit)"]},"b":{"h":"🏠 Internal","body":["Moving within one country","Kaitaia → Auckland","Auckland → Waiheke","Country town → city (rural–urban)"]}},{"s":"I Do","k":"ask","h":"Aroha leaves New Zealand to live in London. Is she an emigrant or an immigrant?","body":["Both! She is an **emigrant** from NZ and an **immigrant** to the UK.","It depends which country you are standing in."]},{"s":"We Do","k":"steps","h":"The Value Continuum","intro":"Stand on the line. Short move, same country ← → long move, new country","body":["Moving from Oneroa to Ostend","A family moves from Christchurch to Auckland for work","A nurse moves from the Philippines to Hamilton","A Waiheke teenager moves to Sydney with their whānau","A refugee family arrives in Palmerston North from Afghanistan"]},{"s":"You Do","k":"task","h":"Your task","body":["book: Copy the four definitions: migration, immigration, emigration, internal migration.","sheet: Write each word in your own words, then sort the six moves on your worksheet.","book: Draw a concept map with MIGRATION in the middle and four branches.","sheet: Finished? Try the extension: old moves vs new moves."]},{"s":"Review","k":"review","h":"Quickfire","body":["Im = In. E = Exit. Internal = inside the country.","Exit question: someone moves from Samoa to Auckland. Name the move from Samoa’s view and from New Zealand’s view."]}],"ws":{"title":"Migration words and moves","intro":"Use the slides and your book to help you.","blocks":[{"t":"wordbank","words":["migration","immigration","emigration","internal migration","international","live"]},{"t":"table","label":"1. Key words in my own words","head":["Word","What it means (my words)","An example"],"w":[22,45,33],"fixed":[["Migration","",""],["Immigration","",""],["Emigration","",""],["Internal migration","",""]],"rowH":2},{"t":"frame","label":"Stuck? Use a sentence starter","starters":["Migration is when people…","Immigration means moving into…","Emigration means leaving…","Internal migration is moving within…"]},{"t":"table","label":"2. Sort the moves. Tick one box in each pair.","head":["Move","Internal","International","Immigrant to NZ","Emigrant from NZ"],"w":[44,14,14,14,14],"fixed":[["a) Tama moves from Kaitaia to Auckland for a job.","","","",""],["b) The Lee family moves from Seoul to Auckland.","","","",""],["c) Mere moves from Wellington to Perth.","","","",""],["d) A farmer retires from Gisborne to Waiheke.","","","",""],["e) A student from Fiji moves to Dunedin to live.","","","",""],["f) A Waiheke family moves to Brisbane.","","","",""]]},{"t":"note","body":"For internal moves, leave the last two columns empty."},{"t":"q","label":"3. Aroha leaves New Zealand to live in London. Explain why she is both an emigrant and an immigrant.","lines":3},{"t":"q","label":"4. Extension: Polynesian voyagers settling Aotearoa about 700 years ago and a family moving here last year are both migration. Write one way they are the same and one way they are different.","lines":4}]},"key":["Q2: a internal; b international + immigrant to NZ; c international + emigrant from NZ; d internal; e international + immigrant to NZ; f international + emigrant from NZ.","Q3: she emigrates from NZ (leaves) and immigrates to the UK (arrives) — the label depends on which country you describe it from."]},{"n":2,"t":"Push and pull","strand":"Why people move","mode":"mix","modeText":"Mix: book 30 min, then device 30 min","tags":[],"li":"We are learning to categorise and evaluate push and pull factors driving migration.","sc":["I can explain what push and pull factors are","I can sort reasons for moving into push or pull","I can explain which factor mattered most for one migrant"],"know":"The decision to migrate balances negative (push) factors at the place of origin with positive (pull) factors at the destination.","prac":"Think conceptually: analyse how conditions at origin and opportunities at destination influence decisions.","vocab":["Push factor","Pull factor","Origin","Destination"],"plan":{"c":"Retrieval on Lesson 1 definitions (Im = In, E = Exit). Then describe the two contrasting places on the slide (or show two photos you choose: a damaged town and a busy beach town advertising jobs). Immediate impressions: which place would you leave, which would you go to?","i":"Model a T-chart on the board: PUSH (lack of jobs, natural disasters, war) vs PULL (safety, higher wages, family ties). Stress that pull factors can be social and environmental, not just money.","w":"Card sort in pairs (cards are on the worksheet — cut out or tick). Sort 12 scenario cards into Push vs Pull. Check as a class; discuss “expensive housing” — a push from where you live.","y":"Move to devices. Open Te Ara / NZ History migrant stories. Choose two migrant accounts and complete the two-column organiser (push factors at origin / pull factors to NZ).","r":"Pair-share: which single factor was most convincing in your case studies, and why?"},"diff":"Highlight key text in the digital articles for target readers. Extension: rank push/pull factors by how strong they are (worksheet Q3).","watch":"Misconception that pull factors are always economic.","ask":"Can a pull factor be social or environmental, like being close to family or a safer climate?","res":[["Te Ara: History of immigration (stories by period)","https://teara.govt.nz/en/history-of-immigration"],["NZ History: The long journey (migrant stories)","https://nzhistory.govt.nz/culture/longjourney-introduction"],["YouTube search: “push and pull factors migration” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=push+and+pull+factors+migration"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Push and pull","sub":"Lesson 2 · Why do people move?"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"two","h":"Which place would you leave? Which would you go to?","a":{"h":"Place A","body":["Houses damaged by fighting","Schools closed","Shops empty, no work"]},"b":{"h":"Place B","body":["Sunny coastal town","“Workers wanted” signs","Peaceful streets, good schools"]}},{"s":"I Do","k":"two","h":"Push and pull factors","a":{"h":"⬅ PUSH factors","body":["Bad things that **push** people away from where they live","No jobs","War or danger","Floods, drought, earthquakes"]},"b":{"h":"PULL factors ➡","body":["Good things that **pull** people to a new place","Jobs and higher wages","Safety","Family already there"]}},{"s":"I Do","k":"idea","h":"Pull factors are not just about money","icon":"🧲","body":["**Economic:** better jobs, higher wages","**Social:** being close to family, good schools, freedom","**Environmental:** safer climate, clean air, space"]},{"s":"We Do","k":"steps","h":"Card sort: push or pull?","intro":"With a partner, sort the 12 cards on your worksheet.","body":["No jobs in my home town","Higher wages","War and fighting","Family already living there","Drought ruins the crops","Good schools for the kids"]},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Finish sorting all 12 cards into Push or Pull.","device: Open a migrant story on Te Ara or NZ History.","sheet: Choose two migrants. Fill in the organiser: push factors at home, pull factors to NZ.","sheet: Extension: rank the factors from strongest to weakest."]},{"s":"Review","k":"review","h":"Pair-share","body":["Which single factor was most convincing for one of your migrants? Why?","Exit: give one push factor and one pull factor that are NOT about money."]}],"ws":{"title":"Push or pull?","intro":"Push factors push people away from where they live. Pull factors pull people to a new place.","blocks":[{"t":"table","label":"1. Card sort. Tick Push or Pull for each card.","head":["Card","Push","Pull"],"w":[70,15,15],"fixed":[["No jobs in my home town","",""],["Higher wages","",""],["War and fighting","",""],["Family already living there","",""],["Drought ruins the crops","",""],["Good schools for the kids","",""],["Persecution because of religion","",""],["A safe, peaceful country","",""],["Housing is too expensive where we live","",""],["A warmer climate","",""],["An earthquake destroyed our home","",""],["A place at university","",""]]},{"t":"table","label":"2. Two migrant stories (from Te Ara or NZ History)","head":["","Migrant 1","Migrant 2"],"w":[24,38,38],"fixed":[["Name and where they came from","",""],["When they came","",""],["Push factors at home","",""],["Pull factors to NZ","",""],["The factor that mattered most","",""]],"rowH":2},{"t":"q","label":"3. Extension: rank the factors for Migrant 1 from strongest (1) to weakest. Explain your number 1.","lines":4}]},"key":["Push: no jobs, war, drought, persecution, expensive housing, earthquake. Pull: higher wages, family, good schools, safe country, warmer climate, university place."]},{"n":3,"t":"Forced to move","strand":"Why people move","mode":"book","modeText":"Bookwork","tags":[],"li":"We are learning to investigate forced migration, distinguishing refugees and asylum seekers from voluntary migrants.","sc":["I can explain the difference between forced and voluntary migration","I can define refugee and asylum seeker","I can describe the experience of a refugee using evidence from a story"],"know":"Migration can be forced. Asylum seekers and refugees are forced to migrate because it is unsafe to stay in their home countries.","prac":"Process information: use personal accounts to describe the experience of forced migrants and refugees.","vocab":["Forced migration","Voluntary migration","Refugee","Asylum seeker"],"plan":{"c":"Retrieval (Lesson 1): “Explain the difference between internal and international migration.” Quick paper check in books.","i":"Teach Forced migration, Refugee (UN status: outside their country, cannot safely return because of a well-founded fear of persecution) and Asylum seeker (has asked for protection; claim not yet decided). Contrast with voluntary migration. Share NZ’s refugee quota (1,500 a year).","w":"Whole-class reading of “Farida’s story” (worksheet). Model underlining the challenges in the first paragraph, then students underline the rest.","y":"In books / on the sheet: empathy map (Sights, Sounds, Feelings, Challenges) and three analytical questions.","r":"Hot-seating: you or a volunteer play a refugee settlement officer. Students ask questions about what new arrivals need."},"diff":"Writing frames on the empathy map. Extension: why does NZ have a quota, and should it be larger? (worksheet Q4).","watch":"Misconception that refugees choose to move for financial gain.","ask":"What is the main reason forcing an asylum seeker to leave their home country?","care":"Some students may have refugee backgrounds or family affected by war. Let students know they never have to share their own story; keep the hot seat in role.","res":[["Immigration NZ: Refugee Quota Programme","https://www.immigration.govt.nz/about-us/our-strategies-and-programmes/supporting-refugees-and-asylum-seekers/refugee-resettlement-strategy/refugee-quota-programme"],["NZ Red Cross: The refugee journey","https://www.redcross.org.nz/about-us/what-we-do/in-new-zealand/supporting-refugees/the-refugee-journey"],["YouTube search: “NZ refugee resettlement stories” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=new+zealand+refugee+resettlement+stories"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Forced to move","sub":"Lesson 3 · Refugees and asylum seekers"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"What is the difference between internal and international migration?","body":["Write your answer in your book. 2 minutes."]},{"s":"I Do","k":"two","h":"Choice, or no choice?","a":{"h":"Voluntary migration","body":["People **choose** to move","For a job, study, family, a better life","They can usually go home again"]},"b":{"h":"Forced migration","body":["People **have to** move","Because of war, persecution or disaster","It is not safe to go home"]}},{"s":"I Do","k":"two","h":"Refugee or asylum seeker?","a":{"h":"Refugee","body":["Has fled their country","Cannot go back because they would be in danger","Their need for protection has been **recognised**"]},"b":{"h":"Asylum seeker","body":["Has fled and **asked** another country for protection","Their claim has **not been decided yet**","Every refugee was once an asylum seeker"]}},{"s":"I Do","k":"fact","stat":"1,500","statlabel":"refugees New Zealand resettles each year through its Refugee Quota","body":["Source: Immigration New Zealand, quota settings 2025–2028."]},{"s":"We Do","k":"idea","h":"Read together: Farida’s story","icon":"📖","body":["It is on your worksheet.","Watch me underline the first challenge Farida faces.","Then underline every other challenge you find."]},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Underline the challenges in Farida’s story.","sheet: Fill in the empathy map: sights, sounds, feelings, challenges.","sheet: Answer questions 1–3 in full sentences.","sheet: Extension: question 4 on the refugee quota."]},{"s":"Review","k":"review","h":"Hot seat: the settlement officer","body":["Ask the officer: what do new families need most in their first month?","Exit: in one sentence, why did Farida’s family leave?"]}],"ws":{"title":"Farida’s story · forced migration","intro":"This story is made up, but it is based on the real experiences of Afghan refugee families who have resettled in New Zealand.","blocks":[{"t":"text","body":"**Farida’s story**"},{"t":"text","body":"Farida is 12. She grew up in Kabul, Afghanistan, where her father was an engineer and her mother taught at a girls’ school. In 2021 the government changed and girls over 12 were stopped from going to school. Her mother lost her job, and the family received threats because her father had worked with foreign organisations."},{"t":"text","body":"One night the family left with two bags each. They crossed into another country and lived for almost two years in a crowded temporary shelter. Farida helped her little brother with English using an old phone. Her grandmother stayed behind because she was too unwell to travel."},{"t":"text","body":"In 2023 the family was accepted by New Zealand as quota refugees. They spent their first six weeks at the Māngere Refugee Resettlement Centre in Auckland, learning about schools, money and buses. Then they moved to a house in Hamilton. Red Cross volunteers met them at the door with a heater and groceries."},{"t":"text","body":"The first winter was colder than anything Farida expected. Her father cannot work as an engineer yet because his qualifications must be checked, so he works nights in a warehouse. Farida is now at intermediate school. She says the hardest part is missing her grandmother, and the best part is that she can go to school every day."},{"t":"table","label":"1. Empathy map. What might Farida have…","head":["Seen","Heard"],"w":[50,50],"rows":1,"rowH":4},{"t":"table","label":"","head":["Felt","Found challenging"],"w":[50,50],"rows":1,"rowH":4},{"t":"frame","label":"Sentence starters","starters":["Farida might have seen…","She probably felt… because…","One challenge was…"]},{"t":"q","label":"2. Was Farida’s family voluntary or forced migrants? Use two pieces of evidence from the story.","lines":4},{"t":"q","label":"3. Name two push factors and two pull factors in the story.","lines":4},{"t":"q","label":"4. Name one challenge the family faced after arriving in NZ, and who helped them.","lines":3},{"t":"q","label":"5. Extension: New Zealand resettles 1,500 refugees a year. Should that number be bigger, smaller or the same? Give a reason.","lines":4}]},"key":["Q2: forced — threats against the family; girls stopped from going to school; left at night with two bags.","Q3: push — threats, school closed for girls, mother lost job; pull — safety, school for Farida, accepted as quota refugees.","Q4: cold winter / qualifications not recognised / missing grandmother; helped by the resettlement centre and Red Cross volunteers."]},{"n":4,"t":"Reading flow maps","strand":"Migration to Aotearoa","mode":"device","modeText":"On device","tags":["Numeracy"],"li":"We are learning to construct and interpret flow maps showing immigration patterns to New Zealand.","sc":["I can explain that arrow width shows the amount of movement","I can calculate arrow widths using a scale","I can draw a flow map with a clear key"],"know":"Patterns of migration can be shown using flow maps, with the width of the arrow showing the amount of movement.","prac":"Process information: use flow maps to show patterns of immigration to New Zealand.","vocab":["Flow map","Scale","Key","Net migration"],"plan":{"c":"Retrieval (Lesson 2): “Name two push factors and two pull factors.” Online submission (Google Form or Classroom question).","i":"[NUMERACY] Demonstrate how arrow width represents numbers. Scale for this lesson: 1 mm = 1,000 migrants. Model step by step: width = number ÷ 1,000. India 17,000 → 17 mm. Point out that arrow length only shows distance.","w":"Together: calculate and draw three arrows (United Kingdom, Samoa, Philippines) on the board or a shared Google Drawing. Check each width against the scale.","y":"On devices: use the practice dataset (worksheet) to build a digital flow map of all seven origins into NZ in Google Drawings / Slides over a blank world map. Include a scale key and title. Finish the worksheet questions.","r":"Screen-share two student maps. Class evaluates: is the key clear? Are the widths mathematically right?"},"diff":"Pre-scaled arrow templates (worksheet Q1 already has the first two worked). Extension: net migration calculation (worksheet Q5) using real Stats NZ figures.","watch":"Misconception that arrow length shows quantity rather than width.","ask":"On a flow map, does line length show distance or amount of movement?","res":[["Stats NZ: Migration topic","https://www.stats.govt.nz/topics/migration"],["Figure.NZ: migrant arrivals by citizenship (e.g. India)","https://figure.nz/chart/ESJOsNYk3yYcx9IO-QbYJkT9ysSm6n9b5"],["YouTube search: “how flow maps work” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=flow+map+geography+arrow+width"]],"hw":"Week 2 homework set: flow map practice (3 questions, 20 min). Due Lesson 7.","slides":[{"s":"Connect","k":"title","h":"Reading flow maps","sub":"Lesson 4 · Numeracy in geography"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Name two push factors and two pull factors","body":["Answer in the Classroom question. 3 minutes."]},{"s":"I Do","k":"flow","h":"A flow map shows movement","note":"Practice data: rounded numbers for learning the skill, not official figures."},{"s":"I Do","k":"idea","h":"Width shows how many. Length shows distance.","icon":"📏","body":["The **wider** the arrow, the **more** people moved.","The **length** of the arrow only shows how far they travelled.","Always read the **key** first."]},{"s":"I Do","k":"steps","h":"Working out an arrow width","intro":"Scale: 1 mm = 1,000 migrants","body":["Find the number: India = 17,000","Divide by the scale: 17,000 ÷ 1,000","Answer: the arrow is 17 mm wide","Draw it, and label it"]},{"s":"We Do","k":"table","h":"Let’s calculate three together","head":["Origin","Migrants","÷ 1,000","Arrow width"],"rows":[["United Kingdom","8,000","8,000 ÷ 1,000","? mm"],["Samoa","3,000","3,000 ÷ 1,000","? mm"],["Philippines","14,000","14,000 ÷ 1,000","? mm"]]},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Finish the width column for all seven countries.","device: Open a blank world map in Google Drawings or Slides.","device: Draw seven arrows into NZ at the right widths. Add a title and a key.","sheet: Answer questions 2–4. Extension: question 5."]},{"s":"Review","k":"review","h":"Check two maps","body":["Is the key clear? Are the widths right?","Exit: on a flow map, what does the length of an arrow tell you?"]}],"ws":{"title":"Flow map maths","intro":"Practice data: rounded numbers for learning the skill. Real figures change every month — see Stats NZ.","blocks":[{"t":"img","name":"flow","w":15},{"t":"table","label":"1. Scale: 1 mm = 1,000 migrants. Work out each arrow width.","head":["Country of origin","Migrants to NZ (practice data)","Calculation","Arrow width (mm)"],"w":[28,26,26,20],"fixed":[["India","17,000","17,000 ÷ 1,000","17"],["China","15,000","15,000 ÷ 1,000","15"],["Philippines","14,000","",""],["United Kingdom","8,000","",""],["South Africa","6,000","",""],["Fiji","4,000","",""],["Samoa","3,000","",""]]},{"t":"q","label":"2. Which country has the widest arrow? What does that tell you?","lines":2},{"t":"q","label":"3. How many times wider is the India arrow than the Samoa arrow? Show your working.","lines":3},{"t":"q","label":"4. The arrow from the United Kingdom is much longer than the arrow from Fiji. Does that mean more people came from the UK? Explain.","lines":3},{"t":"text","body":"**Real data (Stats NZ, year ended September 2025):** 138,900 migrants arrived in New Zealand and 126,500 departed."},{"t":"q","label":"5. Extension: Net migration = arrivals − departures. Calculate New Zealand’s net migration for that year. Is it a gain or a loss?","lines":3}]},"key":["Q1 widths: 17, 15, 14, 8, 6, 4, 3 mm.","Q2: India — the most migrants came from India.","Q3: 17 ÷ 3 ≈ 5.7 times wider.","Q4: No — length shows distance travelled; width shows the number of people.","Q5: 138,900 − 126,500 = 12,400, a net gain."]},{"n":5,"t":"Who came after the war?","strand":"Migration to Aotearoa","mode":"mix","modeText":"Mix: book 20 min, then device 40 min","tags":[],"li":"We are learning to trace post-WWII shifts in New Zealand’s international migrant origin groups.","sc":["I can describe the Assisted Passage Scheme","I can explain how the main origins of migrants changed after 1945","I can link a change in government policy to a change in who came"],"know":"The origin of international migrants changed after WWII — from Britain and Europe to the Pacific and Asia — driven by changing factors and incentives such as the Assisted Passage Scheme.","prac":"Process information from historical articles and websites to trace changing migration trends.","vocab":["Assisted Passage","Policy","Origin","Propaganda"],"plan":{"c":"Retrieval (Lesson 3): “Define asylum seeker.” Quick mini-whiteboard response.","i":"Present the timeline slide: 1947 Assisted Passage begins (British migrants, given jobs, two-year bond); 1950 extended to the Netherlands; 1960s–70s Pacific workers recruited for factories; 1975 scheme winds down; 1987 Immigration Act chooses migrants by skills not nationality; 1991 points system; 2000s Asia becomes the largest source.","w":"Look at an Assisted Passage recruitment poster together (search DigitalNZ or NZ History — link below). Identify the pull factors and the “selling” techniques: sunshine, space, jobs, happy families.","y":"On devices: read Te Ara “History of immigration” (pages on 1945–1975 and after) and complete the comparison grid across the decades.","r":"Summary line in books: “How did NZ’s main sources of migrants change between 1945 and 2000?”"},"diff":"Structured comparison grid with the first row filled in. Extension: what did the 1987 Immigration Act change? (worksheet Q4).","watch":"Misconception that NZ migration was always multicultural.","ask":"Which region dominated NZ immigration before the late 20th century?","res":[["Te Ara: Assisted immigration 1946–1975","https://teara.govt.nz/en/history-of-immigration/page-14"],["NZ History: Assisted immigration from the UK","https://nzhistory.govt.nz/culture/assisted-immigration-to-nz-from-the-uk"],["DigitalNZ search: assisted passage posters","https://digitalnz.org/records?text=assisted+passage+New+Zealand+poster"],["YouTube search: “NZ assisted passage scheme” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=new+zealand+assisted+passage+scheme"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Who came after the war?","sub":"Lesson 5 · Migration to Aotearoa since 1945"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Define “asylum seeker”","body":["Mini whiteboards up in 60 seconds."]},{"s":"I Do","k":"timeline","h":"How migration to NZ changed","items":[["1947","Assisted Passage begins — British migrants"],["1950","Scheme extended to Dutch migrants"],["1960s–70s","Pacific workers recruited for factories"],["1987","Immigration Act: skills, not nationality"],["1991","Points system introduced"],["2000s","Asia becomes the largest source"]]},{"s":"I Do","k":"fact","stat":"100,000+","statlabel":"people came to New Zealand on the Assisted Passage Scheme in about 30 years after 1947","body":["Migrants were given jobs and had to stay under a two-year bond.","At first it was mainly for British people. Source: Te Ara."]},{"s":"We Do","k":"idea","h":"Read a recruitment poster","icon":"🪧","body":["What does the poster **show**? (sunshine, beaches, families, space)","What **pull factors** is it selling?","What does it **leave out**?"]},{"s":"You Do","k":"task","h":"Your task","body":["device: Open Te Ara: History of immigration (link on Classroom).","sheet: Fill in the comparison grid for each decade.","sheet: Answer questions 2–3.","book: Write your summary line."]},{"s":"Review","k":"review","h":"Summary line","body":["How did New Zealand’s main sources of migrants change between 1945 and 2000?","Use the words: Britain, Pacific, Asia, policy."]}],"ws":{"title":"Who came, when, and why?","intro":"Use Te Ara: History of immigration and the slides.","blocks":[{"t":"table","label":"1. Comparison grid","head":["Period","Main places migrants came from","Why they came (pull factors)","Government policy"],"w":[16,28,28,28],"fixed":[["1945–1960","Britain, then the Netherlands","Jobs, housing, a fresh start after the war","Assisted Passage (from 1947)"],["1960s–1970s","","",""],["1980s–1990s","","",""],["2000s–today","","",""]],"rowH":3},{"t":"q","label":"2. Poster analysis: name two pull factors a recruitment poster tried to sell, and one thing it might have left out.","lines":4},{"t":"q","label":"3. Which region dominated migration to NZ before the 1970s? How do you know?","lines":3},{"t":"q","label":"4. Extension: the Immigration Act 1987 changed how migrants were chosen. What changed, and how did that change where migrants came from?","lines":4},{"t":"q","label":"Summary: How did New Zealand’s main sources of migrants change between 1945 and 2000?","lines":4}]},"key":["Grid: 1960s–70s Pacific Islands (Samoa, Tonga, Cook Islands, Niue) — factory and labouring jobs — work schemes / labour recruitment; 1980s–90s growing Asian migration — skills, study, business — 1987 Act, 1991 points system; 2000s China, India, Philippines plus UK/South Africa — skills shortages, study, family.","Q4: migrants chosen on skills/qualifications not nationality (end of “traditional source country” preference) → more Asian migration."]},{"n":6,"t":"Living close together","strand":"Migration to Aotearoa","mode":"mix","modeText":"Mix: book 25 min, then device 35 min","tags":["AI"],"li":"We are learning to examine spatial clustering of migrant groups in urban areas.","sc":["I can define spatial clustering","I can give three reasons migrants settle near each other","I can check AI information instead of just accepting it"],"know":"Migrant groups settle in geographic clusters that offer networks of support within particular suburbs.","prac":"Think conceptually: connect spatial clustering to support networks and keeping culture strong.","vocab":["Spatial clustering","Support network","Suburb"],"plan":{"c":"Retrieval (Lesson 4): “What does arrow width show on a flow map?”","i":"Explain spatial clustering. Model why new arrivals settle near people from their own community: language, specialist food shops, places of worship, jobs found through friends, help with forms.","w":"Look at Auckland examples: large Pacific communities in South Auckland (Ōtara, Māngere, Ōtāhuhu); Chinese and Korean businesses along Dominion Road and in Howick; Indian communities in Sandringham and Papatoetoe. Use Stats NZ census place summaries if time.","y":"AI Level 2 · AI to plan. (1) Brain first, 3 min, no device: write 3 reasons — hand in. (2) AI step, 10 min: exact prompt on the slide in Gemini. (3) Check it, 5 min: find one group or detail the AI missed and verify it with a search. (4) Own it, 15 min, AI closed: paragraph in book.","r":"Share answers with a partner; summarise the key insights."},"diff":"Writing template for step 4 on the worksheet. Extension: possible drawbacks of clustering (isolation, fewer chances to learn English).","watch":"Misconception that spatial clustering is legally enforced segregation.","ask":"Is spatial clustering usually a voluntary choice for support networks?","res":[["Stats NZ: 2023 Census place summaries","https://www.stats.govt.nz/topics/census"],["Gemini (school account)","https://gemini.google.com"],["YouTube search: “Dominion Road culture” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=dominion+road+auckland+food+culture"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Living close together","sub":"Lesson 6 · Spatial clustering"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"What does the width of an arrow show on a flow map?","body":["Tell your partner, then we share."]},{"s":"I Do","k":"idea","h":"Spatial clustering","icon":"📍","body":["**Spatial clustering** = people from the same community choosing to live close together.","It usually happens because people **want** support — not because they are forced."]},{"s":"I Do","k":"two","h":"Why settle near your own community?","a":{"h":"Practical help","body":["People who speak your language","Help finding work and housing","Help with forms, banks, schools"]},"b":{"h":"Keeping culture strong","body":["Food shops with familiar ingredients","Places of worship","Festivals, sport and clubs"]}},{"s":"We Do","k":"table","h":"Clusters in Auckland","head":["Area","Large communities","What you might see"],"rows":[["Ōtara, Māngere, Ōtāhuhu","Pacific peoples","Pacific churches, markets, fale-style buildings"],["Dominion Road, Howick","Chinese, Korean","Bilingual signs, restaurants, Asian supermarkets"],["Sandringham, Papatoetoe","Indian","Spice shops, temples, Diwali events"]]},{"s":"You Do","k":"steps","h":"AI task · four steps","intro":"AI Level 2 · AI to plan","body":["Brain first (3 min, no device): write 3 reasons a new family from Korea or Samoa might live near others from home. Hand it in.","AI step (10 min): type the exact prompt from the next slide into Gemini.","Check it (5 min): find one group or detail the AI missed. Check it with a search.","Own it (15 min, AI closed): write your paragraph in your book."]},{"s":"You Do","k":"idea","h":"The exact prompt","icon":"🤖","body":["“Give me 3 examples of support networks that ethnic clusters provide for new migrants in Auckland, such as language support, food, or community groups. Keep explanations simple for Year 7.”","Own it question: **Why might spatial clustering change over generations?**"]},{"s":"Review","k":"review","h":"Partner share","body":["Read your paragraph to a partner. What is one idea they had that you did not?","Exit: is spatial clustering usually a choice? Explain."]}],"ws":{"title":"Spatial clustering · brain first, then AI","intro":"You think first. The AI helps you plan. You check it. Then you write it yourself.","blocks":[{"t":"q","label":"1. Brain first (no device): write 3 reasons why a new family from Korea or Samoa might want to live near others from their country.","lines":4},{"t":"q","label":"2. AI step: write down the 3 support networks Gemini gave you.","lines":4},{"t":"q","label":"3. Check it: name one community group or detail the AI missed or got wrong. How did you check it?","lines":3},{"t":"frame","label":"4. Own it (AI closed). Writing template","starters":["Spatial clustering is when…","Migrants often settle near each other because…","For example, in Auckland…","Over generations, clustering might change because…"]},{"t":"lines","label":"My paragraph","n":9},{"t":"q","label":"Extension: could spatial clustering ever have drawbacks? Give one.","lines":3},{"t":"ai"}]},"key":["Generations: children grow up speaking English, go to university, move for work, marry into other communities, buy houses in other suburbs — so clusters may spread out or change."]},{"n":7,"t":"Reading the street","strand":"Migration changes places","mode":"mix","modeText":"Mix: book 35 min, then device 25 min","tags":["Literacy"],"li":"We are learning to evaluate how migrants shape the physical characteristics of local places.","sc":["I can scan a photo for geographical clues","I can annotate signs, shops and buildings that show migration","I can explain how a street shows community identity"],"know":"The characteristics of places (shops, services, language, signs, buildings) are shaped by migrants.","prac":"Process information: use photographs to show how the character of places changes as a result of migration.","vocab":["Annotate","Streetscape","Bilingual","Characteristics"],"plan":{"c":"Retrieval (Lesson 5): “Name the scheme that helped British migrants come to NZ after WWII.”","i":"[LITERACY] Teach the four-part scan: Signs → Shops → Buildings → People. Model annotating the street diagram on the slide: arrow + label + “this shows…”. A label names; an annotation explains.","w":"Annotate a sample streetscape together. Print or project a Street View image you choose (e.g. Dominion Road, Balmoral or Ōtāhuhu town centre) and use the checklist.","y":"Books/sheet: annotate two printed streetscape photos (teacher prints from Street View). Then devices: fill the comparison table of shop types and signage for both streets.","r":"Class discussion: how do these physical signs show a community’s identity?"},"diff":"Sentence frames for annotations on the sheet. Challenge: compare an old photo of the same street with today (DigitalNZ / Auckland Libraries Heritage Collections).","watch":"Misconception that cultural impact is invisible.","ask":"What physical evidence on a shop front shows cultural influence?","res":[["Google Street View: Dominion Road, Balmoral","https://www.google.com/maps/place/Dominion+Rd,+Auckland"],["Auckland Libraries Heritage Collections (old street photos)","https://kura.aucklandlibraries.govt.nz"],["YouTube search: “Sandringham Auckland Indian shops” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=sandringham+auckland+spice+shops"]],"hw":"Week 3 homework set: revision for the mid-unit check — flashcards and practice quiz (25 min). Due Lesson 10. (Optional: photograph or list 3 signs of cultural diversity near you.)","prep":"Print two streetscape photos per student (Street View screenshots work). Suggested: Dominion Road, Balmoral and Ōtāhuhu town centre.","slides":[{"s":"Connect","k":"title","h":"Reading the street","sub":"Lesson 7 · How migrants shape places"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"What was the scheme that helped British migrants come to NZ after WWII?","body":["Hands up — then tell me one thing it offered."]},{"s":"I Do","k":"steps","h":"Scan a street in four steps","intro":"Look like a geographer","body":["**Signs** — what languages? Are they bilingual?","**Shops** — what do they sell? Who is it for?","**Buildings** — styles, colours, places of worship","**People** — what are they doing? Markets? Events?"]},{"s":"I Do","k":"street","h":"Label or annotation?"},{"s":"I Do","k":"two","h":"A label names. An annotation explains.","a":{"h":"Label","body":["“Korean sign”"]},"b":{"h":"Annotation","body":["“A sign in Korean and English shows the shop serves Korean-speaking customers who live nearby.”"]}},{"s":"We Do","k":"idea","h":"Annotate together","icon":"🔍","body":["Use the four steps on the photo on the screen.","Arrow → what you see → what it shows.","Aim for one annotation for each step."]},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Annotate Photo A and Photo B. At least four annotations each.","device: Fill in the comparison table: shop types, signs, buildings.","sheet: Answer the final question in full sentences."]},{"s":"Review","k":"review","h":"Class discussion","body":["How do signs, shops and buildings show a community’s identity?","Exit: name one thing on a shop front that shows cultural influence."]}],"ws":{"title":"Reading the street · photo annotation","intro":"Glue or print a photo in each box. Draw arrows and write annotations around it.","blocks":[{"t":"table","label":"Checklist: tick when you find one","head":["Signs","Shops","Buildings","People"],"w":[25,25,25,25],"fixed":[["☐ another language","☐ specialist food","☐ place of worship","☐ market or event"],["☐ bilingual sign","☐ restaurant","☐ building style","☐ clothing / dress"],["☐ flags or symbols","☐ services (money transfer, travel)","☐ colours or decoration","☐ community notices"]]},{"t":"box","label":"Photo A · Street: ______________________","h":6},{"t":"box","label":"Photo B · Street: ______________________","h":6},{"t":"frame","label":"Annotation starters","starters":["This sign in … shows that…","This shop sells … which suggests…","The style of this building shows…"]},{"t":"table","label":"Comparison table","head":["","Photo A","Photo B"],"w":[24,38,38],"fixed":[["Types of shops","",""],["Languages on signs","",""],["Buildings","",""],["Which community/ies?","",""]],"rowH":2},{"t":"q","label":"How do the signs, shops and buildings in one of your photos show that migration has changed this place?","lines":5}]}},{"n":8,"t":"What migrants bring","strand":"Migration changes places","mode":"device","modeText":"On device","tags":[],"li":"We are learning to categorise the cultural, economic and political contributions of migrant groups to New Zealand.","sc":["I can name the three kinds of contribution","I can sort real examples into cultural, economic or political","I can present one community’s contributions across all three"],"know":"Migrant groups contribute culturally (food, arts, language), economically (filling skills shortages, businesses) and politically (representation in government).","prac":"Communicate findings by describing the many contributions of migrant groups to the places they settle.","vocab":["Cultural","Economic","Political","Contribution"],"plan":{"c":"Retrieval (Lesson 6): “Explain one reason why migrants form spatial clusters.”","i":"The three pillars: Cultural (arts, food, festivals, language, sport), Economic (filling skills shortages, starting businesses, working in essential jobs), Political (voting, standing for local boards, councils and Parliament, community advocacy).","w":"Sort the six examples on the slide into the three pillars using a shared board (Jamboard alternative: Google Slides or Padlet). Discuss ones that fit more than one.","y":"On devices: research one migrant community in Aotearoa (e.g. Indian, Chinese, Samoan, Tongan, Filipino, South African, Dutch) and make a 3-slide presentation — one slide per pillar, with one specific example and a source each.","r":"Peer review: swap screens with a partner. One compliment and one suggestion."},"diff":"Slide outline template with prompts (worksheet). Extension: find a figure for the economic contribution (e.g. workforce share in health) and cite the source.","watch":"Misconception that contributions are only food and festivals.","ask":"How do migrants contribute to our economy and our government?","res":[["Ministry for Ethnic Communities","https://www.ethniccommunities.govt.nz"],["Te Ara: New Zealand peoples (ethnic communities)","https://teara.govt.nz/en/new-zealand-peoples"],["YouTube search: “migrant contributions New Zealand” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=migrant+contributions+new+zealand"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"What migrants bring","sub":"Lesson 8 · Contributions to Aotearoa"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Why do migrants often live close to people from their own community?","body":["One reason each. Go round the room."]},{"s":"I Do","k":"three","h":"Three kinds of contribution","cols":[["🎭 Cultural",["Food and restaurants","Music, dance, art","Festivals, sport, language"]],["💼 Economic",["Filling skills shortages","Starting businesses","Nurses, builders, farm workers"]],["🏛️ Political",["Voting","Local boards and councils","Members of Parliament"]]]},{"s":"We Do","k":"steps","h":"Sort these six examples","intro":"Cultural, economic or political?","body":["Pasifika Festival in Auckland","Nurses trained overseas working in NZ hospitals","MPs from migrant families speaking in Parliament","Diwali festival in Aotea Square","A family opening a bakery on the main street","A migrant elected to a local board"]},{"s":"You Do","k":"task","h":"Your task","body":["device: Choose one migrant community in Aotearoa.","sheet: Plan your three slides on the worksheet first.","device: Make 3 slides: cultural, economic, political. One real example and one source on each.","talk: Swap screens with a partner: one compliment, one suggestion."]},{"s":"Review","k":"review","h":"Peer review","body":["One compliment, one suggestion.","Exit: name one economic and one political contribution of migrants."]}],"ws":{"title":"Three kinds of contribution","intro":"Sort, then plan your slides.","blocks":[{"t":"table","label":"1. Sort the examples. Tick one column (or two if it fits both).","head":["Example","Cultural","Economic","Political"],"w":[55,15,15,15],"fixed":[["Pasifika Festival in Auckland","","",""],["Nurses trained overseas working in NZ hospitals","","",""],["MPs from migrant families speaking in Parliament","","",""],["Diwali festival in Aotea Square","","",""],["A family opening a bakery on the main street","","",""],["A migrant elected to a local board","","",""]]},{"t":"text","body":"**2. Slide planner.** My community: ______________________________"},{"t":"table","label":"","head":["Slide","My example","Where I found it (source)"],"w":[20,50,30],"fixed":[["1. Cultural","",""],["2. Economic","",""],["3. Political","",""]],"rowH":3},{"t":"q","label":"3. Which contribution surprised you most? Why?","lines":3},{"t":"q","label":"Peer review — compliment: ______________ Suggestion: ______________","lines":2}]},"key":["Cultural: Pasifika Festival, Diwali. Economic: nurses, bakery. Political: MPs, local board member. (Festivals also have an economic side — accept with reasons.)"]},{"n":9,"t":"Barriers and bridges","strand":"Migration changes places","mode":"book","modeText":"Bookwork","tags":[],"li":"We are learning to examine the barriers migrants face and how communities keep connections to their places of origin.","sc":["I can name three barriers migrants face","I can explain how migrants stay connected to home","I can match a barrier with an organisation that helps"],"know":"Migrants face barriers (discrimination, language, qualification recognition) while keeping connections (language, media, remittances, ethnic associations). Support organisations such as Belonging Aotearoa help.","prac":"Design and evaluate social action: investigate community groups that support migrants to settle.","vocab":["Barrier","Remittances","Qualification","Discrimination"],"plan":{"c":"Retrieval (Lesson 7): “Name two physical changes you can see on a street because of migration.”","i":"Teach the barriers (qualifications not recognised, language, discrimination, cost and isolation) and the connections home (remittances, phone and social media, news from home, ethnic associations, visits). Introduce support groups: Belonging Aotearoa, English Language Partners, Red Cross, local migrant centres.","w":"Case study: Dr Samuel (composite), a doctor from overseas driving an Uber while his qualifications are assessed. Class debate: is it fair? Why might NZ check overseas qualifications carefully?","y":"Books/sheet: double-entry journal — three barriers, each matched with a support solution and the organisation that offers it.","r":"Exit ticket: “State one way migrant support organisations make settling easier.”"},"diff":"Journal with starters. Extension: remittances to Pacific nations — why do they matter for families back home?","watch":"Misconception that checking qualifications is simple or unnecessary.","ask":"Why might overseas qualifications need careful checking?","res":[["Belonging Aotearoa","https://www.belongingaotearoa.org.nz"],["English Language Partners","https://www.englishlanguage.org.nz"],["YouTube search: “supporting migrants New Zealand” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=supporting+migrants+new+zealand"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Barriers and bridges","sub":"Lesson 9 · Settling in a new place"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Name two changes you can see on a street because of migration","body":["Think back to the photos from Lesson 7."]},{"s":"I Do","k":"two","h":"Barriers and connections","a":{"h":"🧱 Barriers","body":["Qualifications not recognised","Learning a new language","Discrimination","Cost, loneliness, no family nearby"]},"b":{"h":"🌉 Connections to home","body":["**Remittances**: money sent home to family","Video calls and social media","News and TV from home","Community associations and churches"]}},{"s":"I Do","k":"idea","h":"Who helps?","icon":"🤝","body":["**Belonging Aotearoa**: settlement advice, jobs help, community connections","**English Language Partners**: English classes and tutors","**Red Cross**: support for refugee families","Churches, mosques, temples and community groups"]},{"s":"We Do","k":"ask","h":"Dr Samuel was a doctor for 12 years. In NZ he drives an Uber while his qualifications are checked. Is that fair?","body":["Think: fairness to Samuel vs safety of patients.","Stand on the side you agree with. Be ready to explain."]},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Read Dr Samuel’s case study.","sheet: Fill in the double-entry journal: 3 barriers, 3 solutions, 3 organisations.","sheet: Answer the debate question."]},{"s":"Review","k":"review","h":"Exit ticket","body":["State one way migrant support organisations make settling easier."]}],"ws":{"title":"Barriers and bridges","intro":"Dr Samuel is a made-up person, but his story is common.","blocks":[{"t":"text","body":"**Dr Samuel’s story.** Samuel worked as a doctor in a hospital for 12 years before moving to Auckland with his family. He speaks English well, but the Medical Council must check that his training meets New Zealand standards. He has to pass exams and pay fees, which can take a long time. While he waits, he drives an Uber at night. He sends money home every month to help his parents. On Sundays the family goes to a church where many families are from their home country, and his children are learning their language at a weekend school."},{"t":"table","label":"1. Double-entry journal","head":["Barrier migrants face","How it can be solved","Organisation or group that helps"],"w":[34,36,30],"fixed":[["1.","",""],["2.","",""],["3.","",""]],"rowH":3},{"t":"frame","label":"Starters","starters":["One barrier is… This makes it hard to…","This could be solved by…","… helps by…"]},{"t":"q","label":"2. Find two ways Samuel’s family stays connected to their home country.","lines":3},{"t":"q","label":"3. Debate: is it fair that Samuel cannot work as a doctor straight away? Give one reason for and one reason against.","lines":5},{"t":"q","label":"4. Extension: what are remittances, and why do they matter to families in the Pacific?","lines":3}]},"key":["Q2: sends money home (remittances); church with people from home; children learning the language at weekend school.","Q3 for: wastes his skills, NZ needs doctors, unfair loss of income. Against: patient safety depends on checking training meets NZ standards."]},{"n":10,"t":"Mid-unit check","strand":"Assessment","mode":"assess","modeText":"Assessment · paper test 40 min, device review 20 min","tags":["Assess"],"li":"We are learning to demonstrate our understanding of international migration, push and pull factors, and flow maps.","sc":["I can define the key words from Lessons 1–9","I can apply them to new examples","I can read a flow map using its key"],"know":"Review of Lessons 1–9: international and internal migration, push/pull factors, forced migration, flow maps and migrant impacts.","prac":"Demonstrate conceptual understanding and skills under timed conditions.","vocab":["All unit words to date"],"plan":{"c":"Five minutes silent review of notes and flashcards. Desks in test layout.","i":"Explain test conditions: 40 minutes, silent, show working for the flow map maths, read the key first.","w":"Read the instructions and Section A example together.","y":"Students complete the mid-unit test on paper (40 min). Modified paper available for students who need it.","r":"Final 20 min on devices: self-check against the answer key you post on Classroom (or mark in pairs). Students note their two weakest questions."},"diff":"Modified test (multiple choice with visual word bank) is in Downloads. Reader/writer for students who need one.","watch":"Flow map scale reading under test conditions.","ask":"Did you check the key before writing your answer?","res":[["Printed mid-unit test papers (Downloads)","#downloads"]],"hw":"Week 4 homework set: read a short Te Ara article on Māori urban migration and write 3 key points (20 min). Due Lesson 13.","slides":[{"s":"Connect","k":"title","h":"Mid-unit check","sub":"Lesson 10 · Assessment"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"idea","h":"Five minutes: quiet review","icon":"📚","body":["Flashcards and notes from Lessons 1–9.","Focus on: im/emigration, push/pull, refugee vs asylum seeker, flow maps."]},{"s":"I Do","k":"steps","h":"Test conditions","intro":"40 minutes · silent","body":["Write your name on the paper","Read every question twice","For flow maps: read the **key** first, show your working","Finished early? Check every answer, then read quietly"]},{"s":"We Do","k":"idea","h":"Read the instructions together","icon":"📝","body":["Look at the Section A example together.","Any questions now — not during the test."]},{"s":"You Do","k":"idea","h":"Test in progress","icon":"⏱️","body":["40 minutes. Silent.","Hand up if you need help."]},{"s":"Review","k":"review","h":"Self-check","body":["Open the answer key on Classroom. Mark your paper in a different colour.","Write down your two weakest questions — these are your goals."]}],"ws":{"title":"Mid-unit check · Migration","intro":"40 minutes. Answer every question. Show your working for maths.","test":true,"blocks":[{"t":"text","body":"**Total: ____ / 40**"},{"t":"text","body":"**Section A · Key words (8 marks).** Write the letter of the correct meaning next to each word."},{"t":"table","label":"","head":["Word","Letter","Meanings"],"w":[28,10,62],"fixed":[["1. Migration","","A. Moving into a new country to live"],["2. Immigration","","B. Leaving your own country to live in another"],["3. Emigration","","C. People moving from one place to another to live"],["4. Internal migration","","D. A person forced to flee whose need for protection has been recognised"],["5. Refugee","","E. Moving within one country"],["6. Asylum seeker","","F. Migrants living close together for support"],["7. Spatial clustering","","G. Money migrants send to family back home"],["8. Remittances","","H. A person who has asked for protection, but their claim is not decided yet"]]},{"t":"text","body":"**Section B · Push or pull (6 marks).** Write PUSH or PULL."},{"t":"table","label":"","head":["Reason","Push or pull?"],"w":[75,25],"fixed":[["9. A flood destroyed the family farm",""],["10. Cousins already live in Auckland",""],["11. There is no university nearby",""],["12. A job offer with higher pay",""],["13. Fighting in the city",""],["14. A safe, peaceful country",""]]},{"t":"text","body":"**Section C · Forced migration (6 marks)**"},{"t":"q","label":"15. Explain the difference between voluntary and forced migration. Give an example of each. (4)","lines":5},{"t":"q","label":"16. Why can a refugee not simply go home? (2)","lines":2},{"t":"text","body":"**Section D · Flow maps (10 marks).** Scale: 1 mm of arrow width = 2,000 migrants. Practice data."},{"t":"table","label":"","head":["Origin","Migrants","Arrow width (mm)"],"w":[40,30,30],"fixed":[["Country P","20,000","17. ______"],["Country Q","8,000","18. ______"],["Country R","","12 mm"]]},{"t":"q","label":"19. How many migrants does the Country R arrow show? Show working. (2)","lines":2},{"t":"q","label":"20. Country Q is further from NZ than Country P. Does that mean its arrow should be wider? Explain. (2)","lines":3},{"t":"q","label":"21. Arrivals 50,000. Departures 35,000. Calculate net migration and say if it is a gain or a loss. (2)","lines":2},{"t":"note","body":"Questions 17 and 18 are worth 2 marks each (1 for working, 1 for answer)."},{"t":"text","body":"**Section E · Paragraph (10 marks)**"},{"t":"q","label":"22. Describe the cultural, economic AND political contributions of ONE migrant group to New Zealand. Use specific examples. Also name one barrier this group might face. (10)","lines":12}]},"key":["A: 1C 2A 3B 4E 5D 6H 7F 8G.","B: 9 push, 10 pull, 11 push, 12 pull, 13 push, 14 pull.","C15: voluntary = choice (e.g. moving for a job); forced = no choice, unsafe to stay (e.g. fleeing war). C16: they would be in danger / persecuted if they returned.","D17: 20,000 ÷ 2,000 = 10 mm. D18: 8,000 ÷ 2,000 = 4 mm. D19: 12 × 2,000 = 24,000. D20: no — width shows numbers, length shows distance. D21: 50,000 − 35,000 = 15,000 net gain.","E22 marking: cultural example (2), economic example (2), political example (2), specific named group/place detail (2), barrier explained (2)."]},{"n":11,"t":"Te hekenga ki ngā tāone","strand":"Moving within Aotearoa","mode":"mix","modeText":"Mix: book 30 min, then device 30 min","tags":["TeAo"],"subtitle":"Māori urban migration","li":"We are learning to analyse post-WWII Māori urban migration, pepper-potting, and the emergence of urban marae.","sc":["I can describe how fast Māori moved to cities after WWII and why","I can explain what pepper-potting was","I can compare an iwi/hapū marae with an urban marae"],"know":"Māori migration to cities happened at unprecedented speed after WWII, driven by a lack of rural work and the pull of urban jobs. Cultural landscapes shifted: weaker links to home marae, pepper-potting housing policy, and new expressions of identity — urban marae and pan-Māori identity.","prac":"Process articles and stories to describe experiences of Māori urbanisation and cultural adaptation.","vocab":["Urbanisation","Pepper-potting","Urban marae","Pan-Māori identity","Whanaungatanga"],"plan":{"c":"Retrieval (Lesson 8): “Define an economic contribution of migrants.”","i":"Teach the context: 1945 about 26% of Māori lived in towns and cities; by 1966, 62%; by 1986 nearly 80% (Te Ara). Drivers: farmland could not support a fast-growing population, few rural jobs, factory jobs and wages in cities. After the Hunn Report (1961) relocation became official policy. Pepper-potting: Māori families placed among Pākehā families in state-housing streets to encourage “integration”. Urban marae such as Hoani Waititi Marae (West Auckland, opened 1980, pan-iwi).","w":"Read the whānau story extract on the worksheet. Annotate push factors (blue) and pull factors (red) together.","y":"Books/sheet: three-column Venn (iwi/hapū marae only · both · urban marae only). Then devices: research Hoani Waititi Marae and answer the research questions.","r":"Structured discussion: how do urban marae help keep whanaungatanga strong in the city?"},"diff":"Venn organiser with prompt labels. Extension: how did earlier land loss make it harder for Māori to make a living in rural areas?","watch":"Misconception that urban migration destroyed Māori cultural identity entirely.","ask":"How did urban marae let Māori create new cultural expressions in cities?","care":"Some students’ whānau will have lived this history. Invite, never require, whānau stories. Check te reo pronunciation of marae and iwi names.","res":[["Te Ara: Urban Māori — urbanisation","https://teara.govt.nz/en/urban-maori/page-1"],["Te Ara: Urban marae (interactive)","https://teara.govt.nz/en/interactive/29701/urban-marae"],["Te Ara: Māori housing — pepper-potting","https://teara.govt.nz/en/maori-housing-te-noho-whare/page-3"],["Hoani Waititi Marae","https://hoaniwaititimarae.co.nz"],["YouTube search: “Māori urban migration” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=maori+urban+migration+1950s+1960s"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Te hekenga ki ngā tāone","sub":"Lesson 11 · Māori urban migration after WWII"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"What is an economic contribution of migrants?","body":["Give an example."]},{"s":"I Do","k":"bars","h":"How fast did Māori move to the cities?","data":[["1945",26],["1956",35],["1966",62],["1986",80]],"unit":"%","label":"Percentage of Māori living in urban areas","note":"Source: Te Ara (1986 figure: “nearly 80%”)."},{"s":"I Do","k":"two","h":"Why move?","a":{"h":"⬅ Push (rural)","body":["Not enough land to support growing whānau","Few jobs in the country","Rural growth slowing"]},"b":{"h":"Pull (urban) ➡","body":["Factory and building jobs","Higher wages","From 1961, government relocation help"]}},{"s":"I Do","k":"two","h":"Pepper-potting and urban marae","a":{"h":"Pepper-potting","body":["Government placed Māori families among Pākehā families in state-housing streets","Aim: “integration into Pākehā society”","Made it harder for whānau to live near each other"]},"b":{"h":"Urban marae","body":["Built by Māori in the cities","Hoani Waititi Marae, West Auckland, opened 1980","**Pan-iwi**: open to all iwi; carvings show seven waka"]}},{"s":"We Do","k":"idea","h":"Read together: the move to Auckland","icon":"📖","body":["Story on your worksheet.","**Blue** = push factors. **Red** = pull factors.","I do the first one, you do the rest."]},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Finish annotating the story.","sheet: Fill in the Venn: iwi/hapū marae · both · urban marae.","device: Research Hoani Waititi Marae. Answer research questions 3–5."]},{"s":"Review","k":"review","h":"Whanaungatanga in the city","body":["How do urban marae help whānau stay connected in the city?","Exit: what was pepper-potting, in one sentence?"]}],"ws":{"title":"Te hekenga ki ngā tāone · moving to the city","intro":"The story is made up, but it is based on many real whānau experiences in the 1950s and 1960s.","blocks":[{"t":"text","body":"**The move to Auckland, 1960.** Rangi was 17 when he left his whānau’s small farm near Kaikohe. There were nine children, and the land could not feed everyone. The only paid work nearby was seasonal, and his older brother had already gone to Auckland and found a job at a car-assembly factory in Ōtāhuhu. His letters home talked about wages every Friday, the pictures and dances, and friends from all over the motu."},{"t":"text","body":"Rangi boarded with his brother at first. Two years later his parents and younger siblings followed, helped by a government scheme. They were given a state house in a new suburb — but in a street where they were the only Māori family. The nearest cousins lived on the other side of the city. On weekends they sometimes drove home to their marae for tangihanga and hui, but as the years went on the trips became less frequent."},{"t":"text","body":"In the city, Rangi joined a Māori club that met in a church hall. People came from many iwi. They practised kapa haka, ran sports teams and helped new arrivals find work. Later, clubs like this helped to build marae in the city, where whānau from any iwi could gather."},{"t":"q","label":"1. Underline push factors in blue and pull factors in red. Then list two of each here.","lines":4},{"t":"table","label":"2. Compare the marae","head":["Iwi/hapū marae only","Both","Urban marae only"],"w":[34,32,34],"rows":1,"rowH":7},{"t":"frame","label":"Prompts","starters":["Who belongs there? (one iwi or many)","Where is it? (home land or city)","What happens there? (tangihanga, hui, kapa haka, learning)"]},{"t":"q","label":"3. Research: when and where did Hoani Waititi Marae open, and who is it for?","lines":3},{"t":"q","label":"4. Research: what do the carvings in the wharenui show, and why was it designed that way?","lines":3},{"t":"q","label":"5. How did the government’s pepper-potting policy affect families like Rangi’s?","lines":3},{"t":"q","label":"Extension: how did earlier loss of land make it harder for Māori to stay in rural areas?","lines":3}]},"key":["Q1 push: land could not feed nine children, only seasonal work; pull: factory job, weekly wages, entertainment, brother already there, government scheme.","Q3: 19 April 1980, Parrs Park/Oratia, West Auckland; pan-iwi — open to all iwi.","Q4: seven migratory waka in different regional styles so no single group could claim ownership.","Q5: placed away from whānau, the only Māori family in the street, harder to keep everyday whanaungatanga."]},{"n":12,"t":"Mapping population change","strand":"Moving within Aotearoa","mode":"device","modeText":"On device","tags":["Numeracy"],"li":"We are learning to interpret choropleth maps and 3D visualisations showing New Zealand internal population change.","sc":["I can read a choropleth map using its key","I can calculate a percentage change in population","I can suggest why one place grew faster than another"],"know":"New Zealand has a mobile population, driven by cost of living, house prices, climate and education. Internal migration is uneven; change is shown in choropleth maps and 3D visualisations.","prac":"Process information: use maps and 3D computer-generated visualisations to show population density and change.","vocab":["Choropleth map","Population density","Percentage change"],"plan":{"c":"Retrieval (Lesson 9): “Name one barrier faced by skilled migrants in NZ.”","i":"Teach choropleth reading: shading shows a value per area; darker = more; ALWAYS check what the key measures (total people, density, or % change). Use the practice map slide. Demonstrate a 3D population visualisation (Stats NZ census maps or similar).","w":"Together on devices: explore a census map of population change by district. Find growth areas (e.g. Queenstown-Lakes) and slower or falling areas. Model the % change formula with Queenstown-Lakes: (47,808 − 39,153) ÷ 39,153 × 100 = 22.1%.","y":"Worksheet: read the practice choropleth, then calculate % change for the real districts in the table and suggest drivers.","r":"Live poll (hands or Classroom question): which place grew fastest and why?"},"diff":"Legend reading guide on the worksheet. Extension: population density per km² (Q5).","watch":"Misconception that dark shading always means total population rather than density or percentage change.","ask":"Does this map key show total people or percentage growth?","res":[["Stats NZ: Census","https://www.stats.govt.nz/topics/census"],["Figure.NZ: Queenstown-Lakes estimated population","https://figure.nz/chart/JaoHTB1RDNnWQ1sF"],["YouTube search: “how choropleth maps work” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=how+to+read+a+choropleth+map"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Mapping population change","sub":"Lesson 12 · Choropleth maps"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Name one barrier faced by skilled migrants in NZ","body":["Thumbs up when you have one."]},{"s":"I Do","k":"choro","h":"Reading a choropleth map","note":"Practice map: made-up regions for learning the skill."},{"s":"I Do","k":"steps","h":"Read the key first","intro":"Three questions every time","body":["What is being measured? Total people, density, or % change?","Which shade means more? (usually darker)","What are the units? People, people per km², or %?"]},{"s":"I Do","k":"steps","h":"Percentage change","intro":"(new − old) ÷ old × 100","body":["Queenstown-Lakes: 39,153 people (2018) → 47,808 (2023)","47,808 − 39,153 = 8,655 more people","8,655 ÷ 39,153 = 0.221","× 100 = **22.1% growth** in five years"]},{"s":"We Do","k":"bars","h":"Population change 2018–2023","data":[["Queenstown-Lakes",22.1],["Buller",8.9],["Auckland",5.4],["Waiheke",1.1]],"unit":"%","label":"Percentage change in census population","note":"Sources: Stats NZ 2023 Census via Crux, Wikipedia (Buller), Knowledge Auckland (Auckland, Waiheke)."},{"s":"You Do","k":"task","h":"Your task","body":["sheet: Answer the practice map questions 1–2.","sheet: Calculate the % changes in the table (Q3).","device: Use a census map to suggest why each place changed (Q4).","sheet: Extension: density (Q5)."]},{"s":"Review","k":"review","h":"Live poll","body":["Which place grew fastest? What might be pulling people there?","Exit: what should you check before reading any choropleth map?"]}],"ws":{"title":"Choropleth maps and population change","intro":"Read the key before you read the map.","blocks":[{"t":"img","name":"choro","w":14},{"t":"q","label":"1. What does this practice map measure? Which region grew the most?","lines":2},{"t":"q","label":"2. Region D is lightly shaded. Does that mean nobody lives there? Explain.","lines":3},{"t":"table","label":"3. Calculate % change: (new − old) ÷ old × 100. Round to 1 decimal place.","head":["Place","Earlier census","Later census","Change (people)","% change"],"w":[26,18,18,19,19],"fixed":[["Queenstown-Lakes (2018 → 2023)","39,153","47,808","8,655","22.1%"],["Buller (2013 → 2018)","10,473","9,591","",""],["Buller (2018 → 2023)","9,591","10,446","",""],["Waiheke (2018 → 2023)","about 9,063","9,162","",""]]},{"t":"note","body":"Sources: Stats NZ census figures reported by Crux (Queenstown-Lakes), Wikipedia (Buller District), Auckland Council Knowledge Auckland (Waiheke 2023 Census summary; the 2018 Waiheke figure is worked back from the reported increase of 99 people)."},{"t":"q","label":"4. Choose two places from the table. For each, suggest one factor (jobs, house prices, lifestyle, climate, tourism) that might explain the change.","lines":5},{"t":"q","label":"5. Extension: density = people ÷ area. A district has 48,000 people and 9,600 km². What is its density?","lines":2}]},"key":["Q1: % population change; the darkest region.","Q2: No — light shading means low growth (or a fall), not no people.","Q3: Buller 2013→18: −882, −8.4%; Buller 2018→23: +855, +8.9%; Waiheke: +99, +1.1%.","Q5: 48,000 ÷ 9,600 = 5 people per km²."]},{"n":13,"t":"Boom town, quiet town","strand":"Moving within Aotearoa","mode":"book","modeText":"Bookwork","tags":[],"li":"We are learning to evaluate the impacts of rapid population growth versus decline on New Zealand towns.","sc":["I can describe economic, social and landscape impacts of growth","I can describe the impacts of population decline","I can write from the perspective of a person affected"],"know":"Growth areas gain jobs and choice but face pressure on infrastructure, housing and the environment. Declining areas lose services, see landscape change and an ageing population.","prac":"Identify values and perspectives: residents, businesses, council and iwi see internal migration differently.","vocab":["Infrastructure","Age structure","Perspective","Population decline"],"plan":{"c":"Retrieval (Lesson 11): “What was the pepper-potting housing policy?”","i":"Growth vs decline. Case studies: Queenstown-Lakes (census population up 22.1% 2018–2023) vs Buller/Westport (down 8.4% 2013–2018 after mining and industry job losses, before recovering). Introduce perspectives: residents, business owners, council, iwi.","w":"Build the comparison table on the whiteboard: Economic / Social / Landscape for growth and for decline.","y":"Books: write a perspective speech or paragraph as EITHER a long-time Queenstown renter facing housing pressure OR a Westport shop owner facing fewer customers.","r":"Debate prep: share perspective points in small groups."},"diff":"Speech starters on the sheet. Extension: what does fast growth cost the council (roads, water, rates)?","watch":"Misconception that population growth is 100% positive.","ask":"What pressures does rapid growth create for roads, housing and hospitals?","res":[["Queenstown Lakes District Council: growth projections","https://www.qldc.govt.nz"],["Buller District (population history)","https://en.wikipedia.org/wiki/Buller_District"],["YouTube search: “Queenstown housing pressure” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=queenstown+housing+crisis+workers"]],"hw":"Week 5 homework set: Queenstown vs Westport comparison sheet (25 min). Due Lesson 16.","slides":[{"s":"Connect","k":"title","h":"Boom town, quiet town","sub":"Lesson 13 · Impacts of growth and decline"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"What was the pepper-potting housing policy?","body":["Write it in one sentence."]},{"s":"I Do","k":"two","h":"Two towns, two stories","a":{"h":"📈 Queenstown-Lakes","body":["39,153 → 47,808 people (2018–2023)","**+22.1%** in five years","Tourism and lifestyle pull people in"]},"b":{"h":"📉 Buller (Westport)","body":["10,473 → 9,591 people (2013–2018)","**−8.4%** in five years","Mining and industry jobs were lost"]}},{"s":"I Do","k":"table","h":"What changes?","head":["","Growth","Decline"],"rows":[["Economic","More jobs, more shops; prices and rents rise","Shops close, fewer jobs"],["Social","Crowded schools, longer waits at the doctor","Young people leave; older population"],["Landscape","New subdivisions on farmland, traffic","Empty buildings, closed services"]]},{"s":"I Do","k":"three","h":"Who sees it differently?","cols":[["🏠 Residents",["Renters vs homeowners","Want affordable housing"]],["🏪 Business & council",["More customers vs more costs","Roads, water, rubbish"]],["🌿 Iwi",["Kaitiakitanga of land and water","Wāhi tapu near new building"]]]},{"s":"We Do","k":"idea","h":"Build the table together","icon":"🧩","body":["Economic · Social · Landscape","One idea each for growth and decline.","Who wins and who loses in each box?"]},{"s":"You Do","k":"task","h":"Your task","body":["book: Choose ONE person: a long-time Queenstown renter, OR a Westport shop owner.","sheet: Plan with the speech starters.","book: Write your speech (about 150 words). Include at least two impacts."]},{"s":"Review","k":"review","h":"Debate prep","body":["Share your strongest point in your group.","Exit: name one problem that comes with fast growth."]}],"ws":{"title":"Boom town, quiet town · a speech from one perspective","intro":"Choose one person. Plan here, write the speech in your book.","blocks":[{"t":"table","label":"1. Impact table (copy from the board)","head":["","Growth (Queenstown-Lakes)","Decline (Buller / Westport)"],"w":[18,41,41],"fixed":[["Economic","",""],["Social","",""],["Landscape","",""]],"rowH":3},{"t":"text","body":"**2. Choose your person (circle one):** a long-time Queenstown renter facing rising rents  ·  a Westport shop owner facing fewer customers"},{"t":"frame","label":"Speech starters","starters":["Kia ora, my name is… and I have lived in … for … years.","In the past, our town…","Now, because of population growth/decline,…","This affects me because…","I think the council should…"]},{"t":"lines","label":"Plan: my three main points","n":6},{"t":"q","label":"3. How might someone with the opposite view see the same change?","lines":3},{"t":"q","label":"Extension: what does fast growth cost a council? Think roads, water and rates.","lines":3}]}},{"n":14,"t":"Our island, our place","strand":"Moving within Aotearoa","mode":"mix","modeText":"Mix: book 35 min, then device 25 min","tags":["Local"],"subtitle":"Waiheke case study","li":"We are learning to examine local population change and migration trends on Waiheke Island.","sc":["I can describe how Waiheke’s population has changed using data","I can explain one impact on housing and services","I can explain Ngāti Pāoa’s connection to the island"],"know":"Internal migration through a local case study: Waiheke Island population change, ferry commuting, housing pressure, tourism impacts, and Mana Whenua (Ngāti Pāoa) connections to place.","prac":"Process information from local articles and census data to describe change in our own area.","vocab":["Mana whenua","Median age","Commuter","Housing affordability"],"plan":{"c":"Retrieval (Lesson 12): “What is a choropleth map?”","i":"Waiheke over 30 years: from a quiet, low-cost, rural/bohemian island to a high-value residential and tourism destination. Ngāti Pāoa as mana whenua; Piritahi Marae in Blackpool. Housing affordability pressures, holiday homes, ferry commuting to the city.","w":"Census figures (slide): population growth slowed from 8  devices: choose a topic (refugee support, Māori urbanisation, Waiheke growth, a migrant community) and build a five-question inquiry matrix in a Google Doc using the starters.","r":"Pair-share: partner checks each question — does it need analysis, or is it a quick fact lookup?"},"diff":"Question matrix sentence starters (Who, What, How, To what extent). Extension: add sub-questions that could be answered with a map.","watch":"Misconception that closed yes/no questions are good inquiry starters.","ask":"How can we rephrase ‘Did people move?’ to explore the consequences of moving?","res":[["Tāhūrangi: NZ Curriculum (Social Sciences)","https://newzealandcurriculum.tahurangi.education.govt.nz"],["YouTube search: “geographical inquiry questions” (TEACHER TO CHECK)","https://www.youtube.com/results?search_query=geography+inquiry+questions"]],"hw":"","slides":[{"s":"Connect","k":"title","h":"Asking better questions","sub":"Lesson 15 · Geographical inquiry"},{"s":"Connect","k":"aim"},{"s":"Connect","k":"ask","h":"Name one social and one economic impact of population decline","body":["Think about Westport."]},{"s":"I Do","k":"steps","h":"The question ladder","intro":"Climb higher for deeper answers","body":["**Fact**: Where do migrants to NZ come from?","**Explain**: Why do migrants choose Auckland?","**Impact**: In what ways do migrants change the character of a suburb?","**Evaluate**: To what extent does spatial clustering help migrants settle?"]},{"s":"I Do","k":"two","h":"Closed or open?","a":{"h":"❌ Closed","body":["Did people move to Waiheke?","Answer: yes. End of research."]},"b":{"h":"✅ Open inquiry","body":["How has people moving to Waiheke changed housing for families who already live there?","Needs evidence, data and perspectives."]}},{"s":"We Do","k":"steps","h":"Reframe these together","intro":"Make each one deeper","body":["Do refugees come to New Zealand?","Where is Hoani Waititi Marae?","How many people live in Queenstown?","Are there Indian shops in Sandrin
